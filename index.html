Affirmer et nier une même chose, nous n’y saurions parvenir : c’est là un principe subjectif, 
dans quoi ne s’exprime aucune « nécessité », mais rien qu’une incapacité. 
Si, selon Aristote, le principe de contradiction est le plus certain de tous les principes, s’il 
est le dernier et le plus foncier auquel se ramènent toutes les démonstrations et qu’en lui réside 
le principe de tous les autres axiomes : alors on devrait examiner avec d’autant plus de rigueur 
tout ce qu’il présuppose au fond d’affirmations préalables. Ou bien l’on affirme par lui quelque 
chose concernant le réel, l’étant, comme si d’ores et déjà l’on en avait une notion acquise par 
ailleurs : c’est-à-dire que des prédicats contradictoires ne sauraient être attribués à l’étant. Ou 
bien ce principe signifie que l’on ne doit pas attribuer semblables prédicats à l’étant ? Et dans 
ce cas, la logique serait un impératif, non pour la connaissance du vrai, mais pour poser et 
accommoder un monde censé s’appeler pour nous le monde vrai. 
Bref, la question reste ouverte : les axiomes logiques sont-ils adéquats au réel, ou bien 
sont-ils des critères et des moyens propres à nous créer préalablement du réel – le concept 
de « réalité » ?... Pour pouvoir affirmer le premier point, il faudrait d’ores et déjà connaître 
l’étant, comme on l’a dit ; ce qui n’est point le cas. Ainsi ce principe contient non pas un critère 
de vérité, mais un impératif quant à ce qui DOIT valoir pour vrai. 
Admis qu’il n’existât point semblable A identique à soi-même, tel que le présuppose toute 
proposition de la logique (comme aussi des Mathématiques) le A serait déjà une apparence, 
la logique n’aurait ainsi pour présupposition qu’un monde purement apparent. En fait, nous 
croyons à cette proposition sous l’impression de l’expérience infinie, qui semble la confirmer 
continuellement. La « chose » – voilà le substrat proprement dit de A : notre croyance aux 
choses est la présupposition de notre croyance à la logique. Le A de la logique, de même que 
l’atome est une construction après coup de la « chose »… Tandis que nous ne comprenons 
point ceci et que nous faisons de la logique un critère de l’être vrai, nous sommes déjà en train 
de poser toutes ces hypothèses, substance, prédicat, objet, sujet, action, etc., en tant que 
réalités : c’est-à-dire de concevoir un monde métaphysique, c’est-à-dire un « monde vrai » (– 
or celui-ci est encore une fois le monde apparent...). 
Les actes de penser les plus originels, l’affirmation et la négation, tenir-pour-vrai et ne-
pas-tenir-pour-vrai, pour autant qu’ils présupposent non seulement une habitude mais un droit 
de tenir-pour-vrai ou de tenir-pour-non-vrai d’une manière générale, sont d’avance dominés 
par une croyance, à savoir que pour nous il existe une connaissance, que l’acte de juger 
PUISSE réellement toucher la vérité : – bref, la logique ne doute pas de pouvoir énoncer 
quelque chose de vrai-en-soi (notamment que des prédicats non-contradictoires puissent lui 
être attribués). 
Ici règne le grossier préjugé sensualiste selon lequel les sensations nous enseignent des 
vérités sur les choses, – je ne puis à la fois dire d’une seule et même chose qu’elle est dure 
et qu’elle est molle (la preuve instinctive « je ne puis avoir simultanément 2 sensations 
contradictoires » – absolument grossière et fausse). L’interdit conceptuel de contradiction 
procède de la croyance que nous pouvons former des concepts, qu’un concept non seulement 
définit le vrai d’une chose, mais le saisit... En fait, la logique (telle la géométrie et l’arithmétique) 
n’est valable que pour des vérités fictives QUE NOUS AVONS CRÉÉES. La logique est la 
tentative pour comprendre le monde réel selon un schème de l’être posé par nous-mêmes, 
pour nous le rendre plus exact, formulable, calculable... 
 
NIETZSCHE, Fragments posthumes, Automne 1887, 9 [97] 
in Œuvres philosophiques complètes

ÉPREUVE D’EXPLICATION DE TEXTE 
 
 
Considérés globalement, les hommes sont d’autant plus des comédiens qu’ils 
sont davantage civilisés ; ils prennent l’apparence de la sympathie, du respect des 
autres, de la décence, de l’altruisme, sans pour autant tromper qui que ce soit, parce 
qu’il est entendu pour tout le monde que rien n’est ici conçu du fond du cœur ; et en 
fait, il est très bien qu’il en aille ainsi dans le monde. Car, dans la mesure où des 
hommes jouent ces rôles, les vertus dont ils ont ainsi simplement, pour un certain 
temps, produit l’apparence, se sont peu à peu véritablement éveillées et s’intègrent 
dans leur disposition d’esprit. Mais tromper ce qui est en nous une puissance 
trompeuse, à savoir le penchant, cela équivaut en revanche à revenir à l’obéissance à 
la loi de la vertu, et ce n’est pas une tromperie, mais au contraire une manière 
innocente de nous illusionner sur nous-mêmes. 
Ainsi, le dégoût vis-à-vis de sa propre existence procède-t-il de la façon dont 
l’esprit se trouve vide de sensations auxquelles il tend sans cesse : il est dû à l’ennui, 
où l’on ressent en même temps la pesanteur de l’inertie, c’est-à-dire à la nausée que 
produit toute occupation qui pourrait s’appeler travail et serait capable de chasser cet 
écœurement, dans la mesure où elle s’associe à de la peine ; il s’agit là d’un sentiment 
extrêmement odieux, dont la cause est simplement le penchant naturel à la 
nonchalance (à un repos que ne précède aucune fatigue). Mais ce penchant est 
trompeur, même en ce qui concerne les fins dont la raison fait à l’homme une loi, dans 
la mesure où il l’incite à être satisfait de lui-même quand il ne fait absolument rien 
(quand il mène une existence végétative dépourvue de tout but), parce qu’alors, en 
tout cas, il ne fait rien de mal. En ce sens, tromper à son tour un tel penchant (ce qui 
se peut faire en jouant à pratiquer les beaux-arts, mais aussi, dans la plupart des cas, 
en se livrant à l’usage social de la conversation), cela s’appelle faire passer le temps 
(tempus fallere). L’expression, ici, indique déjà l’intention : tromper le penchant au 
repos oisif, quand l’esprit se divertit en s’adonnant par jeu aux beaux-arts, quand, ne 
serait-ce que par un simple jeu, en lui-même dépourvu de but, dans un combat 
pacifique, la culture de l’esprit, du moins, se trouve favorisée ; dans le cas contraire, 
cela s’appellerait : tuer le temps. Par la violence, on ne peut rien contre la sensibilité 
en ce qui concerne les penchants ; on est contraint d’en triompher par la ruse et, 
comme dit Swift, de donner à la baleine un tonneau pour la faire jouer, de manière à 
pouvoir sauver le navire1.  
 
KANT, Anthropologie d’un point de vue pragmatique (1798) 
Livre I, §14 « De ce qui est permis en matière d’apparence morale » 
traduction Alain Renaut (1993)  
                                                     
1 Allusion à la Préface du Conte du tonneau (1704) de Jonathan Swift : l’auteur y présente son récit 
comme une allégorie ayant pour fonction d’écarter un danger, tels les marins jetant un tonneau à 
la mer pour leurrer une baleine."

Nous voyons que chaque citoyen relève non de son propre droit, mais de 
celui du corps politique, dont il doit exécuter tous les commandements, et qu’il 
n’a aucun droit de décider lui-même de ce qui est juste ou injuste, moral ou 
immoral. Au contraire, puisque le corps de l’État doit être conduit comme par un 
seul esprit, et que par conséquent la volonté du corps politique doit être tenue 
pour la volonté de tous, ce que le corps politique décide de reconnaître comme 
juste et bon est censé avoir été reconnu comme tel par chacun ; c’est pourquoi, 
même si un sujet juge les décisions du corps politique injustes, il n’en est pas 
moins tenu de leur obéir.  
Mais, peut-on objecter, n’est-il pas contraire au commandement de la 
raison de se soumettre entièrement au jugement d’autrui ? et par conséquent, 
la société civile n’est-elle pas contraire à la raison ? d’où l’on déduirait que la 
société civile est irrationnelle et ne peut donc être créée que par des hommes 
dépourvus de raison : ceux que la raison conduit seraient les moins 
susceptibles de l’établir. La raison n’enseigne rien contre la nature : une saine 
raison ne peut ordonner que chacun relève de son propre droit, aussi 
longtemps  que les hommes sont soumis aux passions ; c’est-à-dire qu’elle en 
affirme l’impossibilité. Ajoutons que la raison enseigne sans réserve aucune à 
chercher la paix ; or on ne peut y parvenir que si le Droit du corps politique 
demeure inviolé, donc : plus un homme est conduit par la raison — c’est-à-dire 
plus il est libre, plus il mettra de fidélité à observer ce Droit et à se conformer 
aux instructions du souverain dont il est le sujet. À cela s’ajoute que la société 
civile s’établit naturellement pour abolir la crainte commune et écarter les 
malheurs communs : ainsi donc le résultat auquel il tend est exactement celui 
que tout homme conduit par la raison s’efforcerait, mais en vain, d’atteindre 
dans l’état naturel ; c’est pourquoi si un homme conduit par la raison doit 
parfois, sur l’ordre du corps politique, accomplir une action qu’il sait contraire à 
la raison, ce dommage est largement compensé par le gain qu’il tire de la 
société civile ; en effet, c’est aussi une loi de la raison que de deux maux il faut 
choisir le moindre ; et nous pouvons en conclure que nul n’agit contre sa raison 
lorsqu’il s’acquitte d’une obligation conforme au droit du corps politique : ce que 
chacun de nous accordera plus facilement, quand nous aurons expliqué 
jusqu’où s’étend la puissance du corps politique, et, par conséquent, son droit. 
 
SPINOZA, Traité politique (1675-1677), chapitre III, §5-6 
Traduction Pierre-François MOREAU (2005)

maladroit ; et qu'un artiste, qui n'a que la géométrie expérimentale, est un ouvrier très

géométrie intellectuelle, qu'un homme, quel qu'il soit, d'une certaine géométrie 
expérimentale. Toute la matière des frottements est restée, malgré les calculs, une affaire de

tous les jours par des gens qui se sont imaginé que les leviers, les roues, les poulies, les 
câbles agissent dans une machine comme sur un papier, et qui, faute d'avoir mis la main à 
l'œuvre, n'ont jamais su la différence des effets d'une machine même, ou de son profil ? 
Une seconde observation que nous ajouterons ici, puisqu'elle est amenée par le sujet, c'est 
qu'il y a des machines qui réussissent en petit, et qui ne réussissent point en grand, et 
réciproquement d'autres qui réussissent en grand et qui ne réussiraient pas en petit. Il faut, 
je crois, mettre du nombre de ces dernières toutes celles dont l'effet dépend principalement 
d'une pesanteur considérable des parties mêmes qui les composent, ou de la violence de la 
réaction d'un fluide, ou de quelque volume considérable de matière élastique, à laquelle ces 
machines doivent être appliquées. Exécutez-les en petit, le poids des parties se réduit à rien; 
la réaction du fluide n'a presque plus de lieu ; les puissances sur lesquelles on avait compté 
disparaissent, et la machine manque son effet. Mais s’il y a, relativement aux dimensions 
d'une machine, un point, s'il est permis de parler ainsi, un terme où elle ne produit plus 
d'effet, il y en a un autre au-delà ou en deçà duquel elle ne produit pas le plus grand effet

déterminée par les autres parties : la machine entière est d'une dimension déterminée

déliée, à donner une solution approchée de ces problèmes, et je suis convaincu qu'il est 
impossible d'obtenir quelque chose de satisfaisant là-dessus de ces géométries séparées, et 
très difficile de ces géométries réunies.

l'introspection se satisfait de constatations. Tous les faits sont immobilisateurs, en nous et hors de 
nous. 
En cessant d'être actif et conscient de la création de ses valeurs, le rationalisme décline jusqu'à 
devenir, en une sorte d'empirisme psychologique, un corps d'habitudes. Il est donc nécessaire que 
l'homme de science réagisse contre le passé de sa propre culture. Une sorte de psychanalyse, 
d'autopsychanalyse, doit être pratiquée pour empêcher l'esprit de s'ankyloser dans ses propres idées 
claires. Une idée claire dans un domaine de recherches peut cesser d'être éclairante en un autre 
domaine. Dans les domaines si nouveaux qui se présentent à la recherche scientifique de notre temps,

l'esprit n'a été plus manifeste, plus active. Par la multiplication et l'approfondissement des valeurs de 
rationalité, le destin intellectuel de la science s'accélère. Il devient, même à faible portée, imprévisible. 
Le rationalisme de la science est une philosophie ouverte.

 De la sévérité des peines dans les divers gouvernements 
 
La sévérité des peines convient mieux au gouvernement despotique, dont le principe est la 
terreur, qu'à la monarchie et à la république, qui ont pour ressort l'honneur et la vertu.  
Dans les États modérés, l'amour de la patrie, la honte et la crainte du blâme, sont des motifs 
réprimants, qui peuvent arrêter bien des crimes. La plus grande peine d'une mauvaise action sera d'en 
être convaincu. Les lois civiles y corrigeront donc plus aisément, et n'auront pas besoin de tant de 
force. 
Dans ces États, un bon législateur s'attachera moins à punir les crimes qu'à les prévenir ; il 
s'appliquera plus à donner des mœurs qu'à infliger des supplices. 
C'est une remarque perpétuelle des auteurs chinois1, que plus dans leur empire on voyait 
augmenter les supplices, plus la révolution était prochaine : c'est qu'on augmentait les supplices à 
mesure qu'on manquait de mœurs. 
Il serait aisé de prouver que, dans tous ou presque tous les États d'Europe, les peines ont 
diminué ou augmenté à mesure qu'on s'est plus approché ou plus éloigné de la liberté. 
Dans les pays despotiques, on est si malheureux, que l'on y craint plus la mort qu'on ne regrette 
la vie : les supplices y doivent donc être plus rigoureux. Dans les États modérés, on craint plus de perdre 
la vie qu'on ne redoute la mort en elle-même : les supplices qui ôtent simplement la vie y sont donc 
suffisants. 
Les hommes extrêmement heureux, et les hommes extrêmement malheureux, sont également 
portés à la dureté, témoin les moines et les conquérants. Il n'y a que la médiocrité et le mélange de la 
bonne et de la mauvaise fortune, qui donnent de la douceur et de la pitié. 
Ce que l'on voit dans les hommes en particulier se trouve dans les diverses nations. Chez les 
peuples sauvages qui mènent une vie très dure, et chez les peuples des gouvernements despotiques 
où il n'y a qu'un homme exorbitamment favorisé de la fortune, tandis que tout le reste en est outragé, 
on est également cruel. La douceur règne dans les gouvernements modérés. 
 
Montesquieu, De l'esprit des lois, Premier volume, livre VI, chapitre IX.

      La fonction du souverain (qu’il s’agisse d’un monarque ou d’une assemblée) 
est contenue dans la fin pour laquelle on lui a confié le pouvoir souverain, et qui 
est le soin de la sûreté du peuple : il y est obligé par la loi de nature, et il est obligé 
d’en rendre compte à Dieu, auteur de cette loi, et à nul autre. Notez que par 
sûreté, je n’entends pas ici la seule préservation, mais aussi toutes les autres 
satisfactions de cette vie que chacun pourra acquérir par son industrie légitime, 
sans danger ni dommage pour la République (1). 
Prendre soin du 
bien du peuple. 
      On n’attend pas, en vérité, que ce résultat soit obtenu par une sollicitude qui 
s’exercerait à l’endroit des individus (sinon pour ce qui est de les protéger des 
traitements injustes quand ils portent plainte), mais plutôt qu’on y pourvoie par 
des mesures générales, consistant d’une part dans un enseignement officiel 
(dispensé à la fois par des leçons et par l’exemple), et de l’autre dans la confection 
et application de bonnes lois, auxquelles les personnes individuelles peuvent 
rapporter leur propre cas. 
Par l’instruction 
et par les lois. 
      Étant donné que, si la souveraineté est privée de ses droits essentiels (tels 
qu’ils ont été spécifiés au chapitre XVIII) la République est par-là dissoute, chacun 
retombant dans cette condition désastreuse de guerre contre tout autre homme 
qui est le plus grand mal qui puisse arriver en cette vie, il est de la fonction du 
souverain de maintenir intacts ces droits ; et il est en conséquence contraire à 
son devoir, premièrement de transférer tel ou tel de ces droits à autrui, ou de 
s’en démettre. En effet, celui qui abandonne les moyens abandonne la fin : et il 
abandonne les moyens, celui qui, étant souverain, se reconnaît assujetti aux lois 
civiles ; qui renonce aux fonctions de juge suprême, ou au pouvoir de décider de 
la guerre ou de la paix de sa propre autorité ; ou à celui d’être juge des nécessités 
de la République ; ou à celui de lever des impôts ou des troupes à tel moment et 
en telle quantité qu’en sa conscience il jugera nécessaire ; ou à celui de créer des 
fonctionnaires et des ministres tant pour la guerre que pour la paix ; ou à celui de 
nommer les professeurs et d’examiner quelles doctrines s’accordent avec la 
défense, la paix et le bien du peuple, ou leur sont contraires. Deuxièmement, il 
est contraire à son devoir de laisser les gens ignorants ou mal informés des 
fondements et des raisons de ces droits essentiels qui sont les siens : c’est dans 
ce cas en effet qu’il est facile d’égarer les hommes et de les amener à lui résister, 
le jour où la République aura besoin que ces droits soient utilisés et exercés. 
      Et il est d’autant plus nécessaire d’enseigner de façon diligente et véridique 
les fondements de ces droits, qu’ils ne peuvent pas s’appuyer sur une loi civile ou 
sur la frayeur d’un châtiment légal. En effet, une loi civile interdisant la rébellion 
(et toute résistance aux droits essentiels de la souveraineté est une rébellion)

                    methodo: `<h2>Méthodologie de l’introduction de l’explication de texte</h2>
                <div class="methodo-block"><h3>Thème</h3><p>Présenter le texte et son thème, en se rapportant si possible à une ou deux notions du programme. Le thème, c’est ce dont le texte parle, son objet.</p></div>
                <div class="methodo-block"><h3>Problème</h3><p>Formuler le problème philosophique que l’auteur affronte. Le problème est la question générale à laquelle l’auteur répond en défendant sa thèse tout au long du texte.</p></div>
                <div class="methodo-block"><h3>Thèse</h3><p>Énoncer la position originale que l’auteur défend pour répondre à ce qui fait problème sur le thème abordé.</p></div>
                <div class="methodo-block"><h3>Enjeux</h3><p>Faire apparaître les motivations rendant nécessaire et légitime le traitement du problème abordé, c’est-à-dire ce qu’il y a à gagner ou à perdre à accepter ou rejeter la thèse de l’auteur.</p></div>
                <div class="methodo-block"><h3>Annonce du plan</h3><p>Présenter l’articulation logique du raisonnement de l’auteur pour prouver sa thèse. Pour chaque partie du texte, il faut présenter : d’une part, sa fonction logique dans l’argumentation générale ; d’autre part son contenu thématique propre. Ex : l’auteur commence par établir que... [partie 1], afin de pouvoir ensuite en déduire que... [partie 2], ce qui lui permet finalement de répondre à l'objection selon laquelle... [partie 3].</p></div>`,

                    methodo: `<h2>Méthodologie du développement de l’explication de texte</h2>
                <div class="methodo-block"><h3>Structure générale</h3><p>Chaque partie du développement correspond à une étape du raisonnement (en général entre 2 et 4). Au sein d’une partie, aller à la ligne pour chaque expression à expliquer, chaque argument à discuter, chaque concept à analyser.</p></div>
                <div class="methodo-block"><h3>Ligne directrice</h3><p>Commencer chaque partie en annonçant ce que l’auteur fait et la fonction de cette étape du raisonnement.</p></div>
                <div class="methodo-block"><h3>Explication linéaire détaillée</h3><p>Expliquer consiste à déplier et mettre en évidence ce qui demeure implicite dans le texte. Tout doit être passé au crible : ce qui n’est pas expliqué n’est pas compris. Chaque élément doit être expliqué dans le détail, dans son rapport à ce qui précède et à ce qui suit, et dans son rapport au sens global du texte.</p>
                <ul>
                    <li>Pour un énoncé directement compréhensible : analyser la forme grammaticale et la tournure (conditionnel, impératif, question rhétorique, gradation), puis le choix du vocabulaire et des expressions au regard de l’intention de l’auteur.</li>
                    <li>Mettre en perspective l’énoncé avec ceux qui le précèdent (pour comprendre sa fonction) et ceux qui le suivent (pour comprendre ce qu’il permet de dire).</li>

                    <li>Pour les expressions ambiguës, concepts compliqués ou arguments alambiqués : proposer des hypothèses d’interprétation, justifier ces hypothèses et reconnaître lorsqu’on est trop incertain qu’il s’agit d’hypothèses.</li>
                </ul></div>

            <div class="methodo-block"><h3>Évidence du sens commun</h3><p>Apporter une réponse franche et unilatérale au sujet en se fondant uniquement sur les définitions des termes principaux du sujet. Ex : puisque [définition 1] et que [définition 2], il paraît évident que [réponse franche au sujet (OUI ou NON)] car [explication de la manière dont les définitions permettent de répondre au sujet].</p></div>
            <div class="methodo-block"><h3>Objection à l’évidence du sens commun</h3><p>L’objection doit montrer que l’évidence du sens commun est insuffisante.</p></div>
            <div class="methodo-block"><h3>Contradiction logique</h3><p>Reformuler l’opposition de manière synthétique et rigoureuse (Évidence du sens commun versus Objection) : faire apparaître le conflit logique entre deux nécessités qui s’excluent mutuellement (pourquoi il semble falloir à la fois une chose et son contraire).</p></div>
            <div class="methodo-block"><h3>Problématique</h3><p>Reformuler la contradiction logique sous forme interrogative et compacte, en manifestant l’impossibilité de répondre (comment concilier deux exigences nécessaires qui semblent s’exclure mutuellement ?).</p></div>
            <div class="methodo-block"><h3>Annonce du plan</h3><p>L’annonce du plan prépare le développement, elle indique les grandes articulations des trois parties, qui doivent répondre de manière progressive à la problématique. Ex : dans un premier moment nous verrons que... mais si cette conception se heurte à des objections... il nous faudra alors dans un deuxième moment... . Enfin, il s’agira dans un dernier moment de...</p></div>`,
                trainingTemplate: `    [AMORCE]\n    [SUJET]\n    [ÉVIDENCE DU SENS COMMUN]\n    [OBJECTION À L’ÉVIDENCE DU SENS COMMUN]\n    [CONTRADICTION LOGIQUE]\n    [PROBLÉMATIQUE]\n    [ANNONCE DU PLAN]`,
                fields: ["AMORCE", "SUJET", "ÉVIDENCE DU SENS COMMUN", "OBJECTION À L’ÉVIDENCE DU SENS COMMUN", "CONTRADICTION LOGIQUE", "PROBLÉMATIQUE", "ANNONCE DU PLAN"]
            },
            dev: {
                methodo: `<h2>Méthodologie du développement de la dissertation</h2>
            <div class="methodo-block"><h3>Thèse</h3><p>Commencer par annoncer la thèse qui va être défendue dans la partie.</p></div>
            <div class="methodo-block"><h3>Sous-parties (Argument & Référence/Exemple)</h3>
            <p><strong>Argument :</strong> justifier la thèse par une raison générale ou passer par des exemples particuliers pour en tirer une loi générale.<br>
            <strong>Continuité et articulation :</strong> l’Argument 1 pose le premier jalon sans transition préalable. En revanche, pour les arguments suivants (Arg 2, 3), reliez-les à ce qui précède pour éviter l’effet « catalogue » : soit par une amorce au début du nouvel argument, soit par une relance à la fin de l’exemple précédent.<br>
            <strong>Référence/Exemple :</strong> mobiliser une référence philosophique (auteur, ouvrage, chapitre) ou un exemple général solide.</p></div>
            <div class="methodo-block"><h3>Conclusion de partie</h3><p>Rappel synthétique de l’analyse proposée : puisque [Arg1], que [Arg2] et que [Arg n], alors [thèse de la partie]. La réunion de vos arguments doit assurer la complétude démonstrative de la thèse sans laisser d'angle mort majeur.</p></div>
            <div class="methodo-block"><h3>Objection à la position défendue</h3><p>Pour éviter le dogmatisme, il faut démontrer que la thèse défendue dans la partie est attaquable en lui opposant une objection rigoureuse. Il existe plusieurs types d'objections :<br><strong>Contradiction interne :</strong> c’est l’objection la plus forte. Il faut montrer que la thèse n'est pas conséquente avec elle-même, qu’elle a des conséquences opposées à ses principes ou encore que ses conséquences se réfutent mutuellement.<br><strong>Réfutation des hypothèses :</strong> c’est une bonne manière de réfuter une thèse. Il s’agit de réfuter les fondations ou les présupposés implicites d’une thèse (qui peuvent être trop lourds, trop coûteux, injustifiables, indémontrables).<br><strong>Réfutation externe :</strong> cette réfutation est plus faible que les autres car on importe ici quelque chose d’extérieur à la thèse pour la réfuter : un contre-exemple (un fait attesté, mais toujours contingent) ou un jugement de valeur (réfutation axiologique montrant des conséquences moralement insoutenables).</p></div>
            <div class="methodo-block"><h3>Transition</h3><p>Amorcer le changement de point de vue par une question.</p></div>`,

            argumentation: {
                methodo: `<h2>Méthodologie de l’argumentation</h2>
            <div class="methodo-block"><h3>Argument</h3>
            <p>Rédiger un argument consiste donner une bonne raison d’adhérer à la position défendue. Dans l’idéal, l’argument doit donc apporter une preuve conceptuelle et abstraite qui démontre la vérité de la position défendue. <strong>Attention à ne pas raconter d’histoires ni donner d’exemples concrets.</strong></p>
            
            <p style="margin-top: 15px; font-weight: bold;">Méthode indirecte – Par étapes&nbsp;:</p>
            <ul style="margin-top: 5px;">
                <li><strong>Le recensement initial&nbsp;:</strong> listez au brouillon deux ou trois exemples marquants qui illustrent la thèse défendue.</li>
                <li><strong>Le regroupement par affinité&nbsp;:</strong> rassemblez les exemples similaires afin de former des blocs cohérents d’illustrations.</li>
                <li><strong>La formalisation abstraite&nbsp;:</strong> interrogez-vous&nbsp;: «&nbsp;Pourquoi ce groupe d’exemples permet-il de justifier la thèse&nbsp;?&nbsp;» La réponse théorique à cette question (le «&nbsp;parce que...&nbsp;» global) constituera votre argument général valide dans tous les cas.</li>
            </ul>

            <p style="margin-top: 15px; font-weight: bold;">Méthode directe – Au choix&nbsp;:</p>
            <ul style="margin-top: 5px;">
                <li><strong>L’emboîtement définitionnel&nbsp;:</strong> déduisez la thèse de l’articulation de définitions de concepts clés.</li>
                <li><strong>Le rapport de causalité&nbsp;:</strong> justifiez la thèse par ses causes ou ses conséquences objectives, par sa finalité ou ses raisons.</li>
                <li><strong>L’action réciproque&nbsp;:</strong> montrez comment les concepts de la thèse défendue interagissent ou s’influencent mutuellement.</li>
                <li><strong>Le raisonnement par l’absurde&nbsp;:</strong> démontrez que la position inverse de la vôtre est impossible à soutenir ou contradictoire.</li>
                <li><strong>La diversification des perspectives&nbsp;:</strong> variez les angles d’approche pour viser une complétude analytique. <em>Note&nbsp;: chaque argument ne traite qu’une perspective déterminée à la fois&nbsp;; c’est la combinaison de plusieurs arguments traitant des angles distincts qui permet de construire une démonstration probante et nuancée.</em> S’appuyer sur des repères clés&nbsp;: (ex&nbsp;: <em>soi / les autres / la société</em>, <em>subjectif / objectif</em>, <em>passé / présent / futur</em>, <em>en théorie / en pratique</em>, <em>désir / devoir</em>, <em>abstrait / concret</em>, <em>légal / légitime</em>, <em>croire / savoir</em>, <em>l’intention / les conséquences</em>, <em>nature / culture</em>, <em>pouvoir&nbsp;: droit légal / capacité matérielle / possibilité logique</em>, <em>corps / esprit</em>, <em>conscient / inconscient</em>, <em>raison / passion</em>, <em>volonté / désir</em>, <em>absolu / relatif</em>, <em>contingent / nécessaire</em>, <em>essentiel / accidentel</em>, <em>obligation / contrainte</em>, <em>public / privé</em>, <em>universel / général / particulier / singulier</em>).</li>
            </ul></div>

            <div class="methodo-block"><h3>Référence / Exemple</h3>
            <p>Donnez du relief à votre argument général à l’aide d’une référence philosophique (Auteur, Œuvre) ou d’un exemple particulier qui peut être historique, littéraire, scientifique, etc.</p>
            <ul style="margin-top: 5px;">
                <li><strong>Universalité et légitimité&nbsp;:</strong> l’exemple doit avoir une portée générale, parler à tout le monde et relever si possible d’un champ de la culture usuellement considéré comme légitime. Évitez les anecdotes personnelles ou triviales.</li>
                <li><strong>Explicitation du lien&nbsp;:</strong> ne vous contentez pas de parachuter votre exemple. Expliquez en toutes lettres en quoi ce cas précis confirme la règle générale que vous avez démontrée dans votre argument.</li>
            </ul></div>`,
                trainingTemplate: `    [ARGUMENT]\n    [RÉF/EX]`,
                fields: ["ARGUMENT", "RÉF/EX"]
            }
        };

        // ============ GESTION DU STOCKAGE LOCAL PAR SUJET (PERSISTANCE & MULTI-PROFILS) ============
        const STORAGE_KEY_V1 = 'philo_concours_ia_saved_data_v1';
        const STORAGE_KEY_V2 = 'philo_concours_ia_saved_data_v2';
        let lastRenderedSubjectKey = null;

        let storageData = {
            version: 2,
            activeProfileId: 1,
            profiles: {
                1: {
                    id: 1,
                    createdAt: Date.now(),
                    lastActive: {
                        concours: 'Agrégation Interne',
            exerciseType: 'dissertation',
                        mode: 'intro',
                        notion: '',
                        sujet: '',
                        customSujet: '',
                        isCustomDissertation: false,
                        notionArg: '',
                        sujetArgIdx: '',
                        customThesis: '',
                        isCustomArgumentation: false,
                        isCustomExplication: false,
                        isCustomExplicationArg: false,
                        explicIdx: '',
                        explicArgIdx: '',
                        activeThesis: '',
                        thesisOrientation: null,
                        activeFragment: null,
                        showHelp: false
                    },
                    subjectsData: {}
                }
            },
            lastActive: {},
            subjectsData: {}
        };

        function getActiveProfile() {
            if (!storageData.profiles || typeof storageData.profiles !== 'object') {
                storageData.profiles = {};
            }
            const pid = storageData.activeProfileId || 1;
            if (!storageData.profiles[pid]) {
                storageData.profiles[pid] = {
                    id: pid,
                    createdAt: Date.now(),
                    lastActive: {
                        concours: 'Agrégation Interne',
            exerciseType: 'dissertation',
                        mode: 'intro',
                        notion: '',
                        sujet: '',
                        customSujet: '',
                        isCustomDissertation: false,
                        notionArg: '',
                        sujetArgIdx: '',
                        customThesis: '',
                        isCustomArgumentation: false,
                        isCustomExplication: false,
                        isCustomExplicationArg: false,
                        explicIdx: '',
                        explicArgIdx: '',
                        activeThesis: '',
                        thesisOrientation: null,
                        activeFragment: null,
                        showHelp: false
                    },
                    subjectsData: {}
                };
            }
            return storageData.profiles[pid];
        }

        function getSubjectStorageKey(exerciseType, mode, sujet) {
            const ex = (exerciseType || 'dissertation').trim().toLowerCase();
            const md = (mode || 'intro').trim().toLowerCase();
            const s = (sujet || '').trim().replace(/[’'`]/g, "'").replace(/\s+/g, ' ');
            return `${ex}_${md}:${s}`;
        }

        function loadStorageData() {
            try {
                // 1. Priorité aux données V2
                const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
                if (rawV2) {
                    const parsedV2 = JSON.parse(rawV2);
                    if (parsedV2 && parsedV2.version === 2 && parsedV2.profiles) {
                        storageData.version = 2;
                        storageData.activeProfileId = parsedV2.activeProfileId || 1;
                        storageData.profiles = parsedV2.profiles;
                        const activeProf = getActiveProfile();
                        storageData.lastActive = activeProf.lastActive || {};
                        storageData.subjectsData = activeProf.subjectsData || {};
                        return;
                    }
                }

                // 2. Migration transparente depuis V1 (aucune perte de données)
                const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
                if (rawV1) {
                    const parsedV1 = JSON.parse(rawV1);
                    if (parsedV1 && typeof parsedV1 === 'object') {
                        storageData.version = 2;
                        storageData.activeProfileId = 1;
                        const prof1 = {
                            id: 1,
                            createdAt: Date.now(),
                            lastActive: (parsedV1.lastActive && typeof parsedV1.lastActive === 'object')
                                ? { ...storageData.profiles[1].lastActive, ...parsedV1.lastActive }
                                : { ...storageData.profiles[1].lastActive },
                            subjectsData: {}
                        };

                        if (parsedV1.subjectsData && typeof parsedV1.subjectsData === 'object') {
                            Object.keys(parsedV1.subjectsData).forEach(key => {
                                const oldItem = parsedV1.subjectsData[key];
                                if (oldItem && typeof oldItem === 'object') {
                                    const crans = [];
                                    if (oldItem.correction && typeof oldItem.correction === 'object') {
                                        const score = (typeof oldItem.correction.globalScore === 'number')
                                            ? oldItem.correction.globalScore
                                            : (Array.isArray(oldItem.correction.scores) && oldItem.correction.scores.length > 0
                                                ? Math.round(oldItem.correction.scores.reduce((a, s) => a + (s.score || 0), 0) / oldItem.correction.scores.length)
                                                : null);
                                        const timeDate = new Date(oldItem.updatedAt || Date.now());
                                        const timeLabel = `${String(timeDate.getHours()).padStart(2, '0')}:${String(timeDate.getMinutes()).padStart(2, '0')}`;
                                        crans.push({
                                            id: 1,
                                            parentId: null,
                                            timestamp: oldItem.updatedAt || Date.now(),
                                            timeLabel: timeLabel,
                                            score: score,
                                            draft: (typeof oldItem.draft === 'string') ? oldItem.draft : '',
                                            correction: oldItem.correction
                                        });
                                    }
                                    prof1.subjectsData[key] = {
                                        activeCranId: crans.length > 0 ? 1 : 'draft',
                                        draftParentId: crans.length > 0 ? 1 : null,
                                        workingDraft: (typeof oldItem.draft === 'string') ? oldItem.draft : '',
                                        crans: crans,
                                        updatedAt: oldItem.updatedAt || Date.now()
                                    };
                                }
                            });
                        }
                        storageData.profiles = { 1: prof1 };
                        storageData.lastActive = prof1.lastActive;
                        storageData.subjectsData = prof1.subjectsData;
                        persistStorageData();
                        return;
                    }
                }
            } catch (e) {
                console.warn("Erreur chargement/migration localStorage:", e);
            }
        }

        function persistStorageData() {
            try {
                const prof = getActiveProfile();
                storageData.lastActive = prof.lastActive || {};
                storageData.subjectsData = prof.subjectsData || {};
                localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(storageData));
            } catch (e) {
                console.warn("Erreur sauvegarde localStorage:", e);
            }
        }

        function getDefaultTemplate(exerciseType, mode) {
            if (exerciseType === 'dissertation') {
                if (mode === 'argumentation') return `    [ARGUMENT]\n    [RÉF/EX]`;
                if (mode === 'dev') return content.dev.trainingTemplate;
                return content.intro.trainingTemplate;
            } else if (exerciseType === 'explication') {
                if (mode === 'argumentation') return `    [REFORMULATION]\n    [ARGUMENT]\n    [RÉF/EX]\n    [TRANSITION]`;
                if (mode === 'dev') return content.explic.dev.trainingTemplate;
                return content.explic.intro.trainingTemplate;
            }
            return `    [AMORCE]\n    [SUJET]\n    [ÉVIDENCE DU SENS COMMUN]\n    [OBJECTION À L'ÉVIDENCE DU SENS COMMUN]\n    [CONTRADICTION LOGIQUE]\n    [PROBLÉMATIQUE]\n    [ANNONCE DU PLAN]`;
        }

        function getSubjectStoredDraftAndCorrection(exerciseType, mode, sujet) {
            const prof = getActiveProfile();
            const key = getSubjectStorageKey(exerciseType, mode, sujet);
            const entry = prof.subjectsData[key];
            const defaultTpl = getDefaultTemplate(exerciseType, mode);

            if (!entry) {
                return {
                    draft: defaultTpl,
                    correction: null,
                    activeCranId: 'draft',
                    crans: []
                };
            }

            const crans = Array.isArray(entry.crans) ? entry.crans : [];

            let latestCranId = null;
            if (crans.length > 0) {
                let maxTs = -1;
                crans.forEach(c => {
                    const ts = c.timestamp || 0;
                    if (ts >= maxTs) {
                        maxTs = ts;
                        latestCranId = c.id;
                    }
                });
            }

            // Si un cran spécifique est sélectionné
            if (typeof entry.activeCranId === 'number') {
                const cran = crans.find(c => c.id === entry.activeCranId);
                if (cran) {
                    let draftText = (typeof cran.draft === 'string') ? cran.draft : defaultTpl;
                    // Si on consulte la dernière saisie, son texte reflète les modifications en cours
                    if (cran.id === latestCranId && typeof entry.workingDraft === 'string' && entry.workingDraft.trim() !== '') {
                        draftText = entry.workingDraft;
                    }

                    return {
                        draft: draftText,
                        correction: entry.hideDraftCorrection ? null : (cran.correction || null),
                        activeCranId: cran.id,
                        crans: crans
                    };
                }
            }

            // Sinon (saisie la plus récente ou travail initial avant 1re évaluation)
            let draftText = (typeof entry.workingDraft === 'string' && entry.workingDraft.trim() !== '')
                ? entry.workingDraft
                : defaultTpl;

            // Si le brouillon en mémoire ne contient que des balises sans aucune rédaction d'élève et sans cran,
            // on actualise automatiquement avec le nouveau gabarit indenté
            if (crans.length === 0 && draftText.replace(/\[[^\]]+\]/g, '').trim() === '') {
                draftText = defaultTpl;
                entry.workingDraft = defaultTpl;
            }

            let refCorrection = null;
            if (!entry.hideDraftCorrection) {
                if (entry.draftParentId) {
                    const parentCran = crans.find(c => c.id === entry.draftParentId);
                    if (parentCran) refCorrection = parentCran.correction || null;
                } else if (crans.length > 0) {
                    refCorrection = crans[0].correction || null;
                }
            }

            return {
                draft: draftText,
                correction: refCorrection,
                activeCranId: latestCranId || 'draft',
                crans: crans
            };
        }

        function updateLastActiveState() {
            const selectNotion = document.getElementById("select-notion");

                customArgAuthor: inputCustomArgAuthor ? inputCustomArgAuthor.value : '',
                customArgWork: inputCustomArgWork ? inputCustomArgWork.value : '',
                customArgFragment: textareaCustomArgFragment ? textareaCustomArgFragment.value : '',
                explicIdx: selectExplic ? selectExplic.value : '',
                explicArgIdx: selectExplicArg ? selectExplicArg.value : '',
                activeThesis: state.activeThesis || '',
                thesisOrientation: state.thesisOrientation || null,

            };
            storageData.lastActive = prof.lastActive;

        function saveCurrentDraftToLastRenderedSubject() {
            const textarea = document.getElementById("training-textarea");
            if (textarea && lastRenderedSubjectKey) {
                const val = textarea.value;
                const prof = getActiveProfile();
                if (!prof.subjectsData[lastRenderedSubjectKey]) {
                    prof.subjectsData[lastRenderedSubjectKey] = {
                        activeCranId: 'draft',
                        draftParentId: null,
                        workingDraft: val,
                        crans: [],
                        updatedAt: Date.now()
                    };
                } else {
                    const entry = prof.subjectsData[lastRenderedSubjectKey];
                    if (typeof entry.activeCranId === 'number') {
                        const activeCran = (entry.crans || []).find(c => c.id === entry.activeCranId);
                        if (!activeCran || activeCran.draft !== val) {
                            entry.draftParentId = entry.activeCranId; // Filiation mémorisée
                            entry.activeCranId = 'draft';             // Bascule sur le brouillon
                            entry.workingDraft = val;
                        } else {
                            entry.workingDraft = val;
                        }
                    } else {
                        entry.workingDraft = val;
                    }
                    entry.updatedAt = Date.now();
                }
                updateLastActiveState();
                persistStorageData();
            }
        }

        // ============ GESTION MULTI-PROFILS (1 À 5) ============
        function activateProfile(targetId) {
            targetId = Number(targetId);
            if (storageData.activeProfileId === targetId) return;
            if (!storageData.profiles[targetId]) return;

            saveCurrentDraftToLastRenderedSubject();
            updateLastActiveState();

            storageData.activeProfileId = targetId;
            lastRenderedSubjectKey = null;

            const prof = storageData.profiles[targetId];
            if (prof && prof.lastActive) {
                restoreLastActiveState();
            }

            persistStorageData();
            render();
            updateFloatingProfileDock();
        }

        function addNewProfile() {
            const existingIds = Object.keys(storageData.profiles).map(Number);
            if (existingIds.length >= 5) {
                alert("Limite de 5 profils maximum atteinte.");
                return;
            }

            let newId = null;
            for (let i = 1; i <= 5; i++) {
                if (!storageData.profiles[i]) {
                    newId = i;

                }

            if (!newId) return;

            saveCurrentDraftToLastRenderedSubject();

            storageData.profiles[newId] = createEmptyProfile(newId);

        function deleteProfile(profileId) {
            profileId = Number(profileId);
            if (profileId === 1) {
                if (!confirm("Réinitialiser le Profil 1 ? Toutes ses données enregistrées (brouillons et historiques de corrections) seront effacées.")) {
                    return;
                }
                storageData.profiles[1] = createEmptyProfile(1);

                if (storageData.activeProfileId === 1) {
                    lastRenderedSubjectKey = null;
                    const prof1 = storageData.profiles[1];
                    if (prof1 && prof1.lastActive) {
                        restoreLastActiveState();
                    }
                    persistStorageData();
                    render();
                    updateFloatingProfileDock();
                } else {
                    persistStorageData();
                    updateFloatingProfileDock();
                }
                return;
            }
            if (!confirm(`Supprimer définitivement le Profil ${profileId} et toutes ses données enregistrées ?`)) {
                return;
            }

            const wasActive = storageData.activeProfileId === profileId;
            delete storageData.profiles[profileId];

            if (wasActive) {
                storageData.activeProfileId = 1;
                lastRenderedSubjectKey = null;
                const prof1 = storageData.profiles[1];
                if (prof1 && prof1.lastActive) {
                    restoreLastActiveState();
                }
                persistStorageData();
                render();
                updateFloatingProfileDock();
            } else {
                persistStorageData();
                updateFloatingProfileDock();
            }
        }

        // ============ GESTION DE L'HISTORIQUE CRANTÉ (OPTION 2 : INSERTION PAR FILIATION) ============
        function insertCranAboveParent(cransArray, newCran, parentId) {
            if (!Array.isArray(cransArray) || cransArray.length === 0) {
                return [newCran];
            }
            if (!parentId) {
                return [newCran, ...cransArray];
            }
            const parentIndex = cransArray.findIndex(c => c.id === parentId);
            if (parentIndex === -1) {
                return [newCran, ...cransArray];
            }
            // Insertion directement au-dessus du parent dans l'ordre visuel (de haut en bas)
            const copy = [...cransArray];
            copy.splice(parentIndex, 0, newCran);
            return copy;
        }

        function selectCran(cranId) {
            const prof = getActiveProfile();
            const sujetActif = obtenirSujetActif();
            const currentSubjectKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
            let entry = prof.subjectsData[currentSubjectKey];
            if (!entry) {
                entry = {
                    activeCranId: 'draft',
                    draftParentId: null,
                    workingDraft: '',
                    crans: [],
                    updatedAt: Date.now()
                };
                prof.subjectsData[currentSubjectKey] = entry;
            }


            entry.activeCranId = cranId;
            if (typeof cranId === 'number') {
                entry.draftParentId = cranId;
                entry.hideDraftCorrection = false;
            }
            entry.updatedAt = Date.now();

            persistStorageData();
            render();
        }

        function deleteCran(cranId) {
            cranId = Number(cranId);
            if (!confirm(`Supprimer définitivement la Saisie ${cranId} ?`)) {
                return;
            }
            const prof = getActiveProfile();
            const sujetActif = obtenirSujetActif();
            const currentSubjectKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
            const entry = prof.subjectsData[currentSubjectKey];
            if (!entry || !Array.isArray(entry.crans)) return;

            entry.crans = entry.crans.filter(c => c.id !== cranId);

            if (entry.activeCranId === cranId) {
                if (entry.crans.length > 0) {
                    entry.activeCranId = entry.crans[0].id;
                    entry.draftParentId = entry.crans[0].id;
                } else {
                    entry.activeCranId = 'draft';
                    entry.draftParentId = null;
                }
            }
            entry.updatedAt = Date.now();
            persistStorageData();
            render();
        }

        // Mise à jour dynamique de la barre latérale gauche (profils et crans)
        function updateFloatingProfileDock() {
            let dock = document.getElementById('floating-profile-dock');
            if (!dock) {
                dock = document.createElement('div');
                dock.id = 'floating-profile-dock';
                dock.className = 'floating-profile-dock';
                dock.title = "Survolez pour afficher les profils et l'historique";
                document.body.appendChild(dock);
            }

            const activeProfileId = storageData.activeProfileId || 1;
            const prof = getActiveProfile();
            const profileIds = Object.keys(storageData.profiles).map(Number).sort((a, b) => a - b);
            const canAddProfile = profileIds.length < 5;

            // Section profils (1 à 5, +)
            let profilesHtml = '<div class="profiles-section" id="profiles-box">';
            profileIds.forEach((pid) => {
                const isActive = pid === activeProfileId;
                const pillClass = isActive ? 'profile-pill active' : 'profile-pill translucent';
                const title = pid === 1 ? 'Profil 1 (Clic droit pour réinitialiser)' : `Profil ${pid} (Clic droit pour supprimer)`;

                profilesHtml += `<div class="profile-pill-slot">`;
                profilesHtml += `  <div class="${pillClass}" title="${title}" onclick="activateProfile(${pid})" oncontextmenu="event.preventDefault(); deleteProfile(${pid});">${pid}</div>`;
                profilesHtml += `</div>`;
            });

            // Bouton "+" directement sous le dernier profil créé
            if (canAddProfile) {
                profilesHtml += `<div class="profile-pill-slot">`;
                profilesHtml += `  <div class="profile-add-btn" title="Ajouter un profil (+)" onclick="addNewProfile()"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="2" x2="6" y2="10"></line><line x1="2" y1="6" x2="10" y2="6"></line></svg></div>`;
                profilesHtml += `</div>`;
            }
            profilesHtml += '</div>';

            let dividerHtml = '';
            let timelineHtml = '';

            // Section historique cranté (affichée uniquement s'il y a des saisies enregistrées)
            const sujetActif = obtenirSujetActif();
            const currentSubjectKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
            const entry = prof.subjectsData[currentSubjectKey] || { activeCranId: 'draft', crans: [] };
            const crans = Array.isArray(entry.crans) ? entry.crans : [];
            const activeCranId = entry.activeCranId !== undefined ? entry.activeCranId : 'draft';

            let latestCranId = null;
            if (crans.length > 0) {
                let maxTs = -1;
                crans.forEach(c => {
                    const ts = c.timestamp || 0;
                    if (ts >= maxTs) {
                        maxTs = ts;
                        latestCranId = c.id;
                    }
                });

                dividerHtml = '<div class="dock-divider"></div>';
                timelineHtml = '<div class="timeline-scroll-area" id="timeline-area">';
                timelineHtml += '<div class="vertical-stem-line"></div>';

                // Crans (ordonnés du plus récent au plus ancien, avec intercalation sur parent)
                crans.forEach(c => {
                    const isCranActive = (activeCranId === c.id) || (activeCranId === 'draft' && (entry.draftParentId === c.id || (!entry.draftParentId && c.id === latestCranId)));
                    const isLatest = c.id === latestCranId;
                    const score = typeof c.score === 'number' ? c.score : 0;
                    const colorClass = getScoreColorClass(score).pill;
                    let cranClass = `cran-pill ${colorClass}`;
                    if (isCranActive) cranClass += ' active';
                    if (isLatest) cranClass += ' is-latest';

                    const label = typeof c.score === 'number' ? c.score : '?';
                    const title = `Saisie ${c.id}${isLatest ? ' (Dernière)' : ''} : ${score}/100 (${c.timeLabel || ''}) — Clic droit pour supprimer`;

                    timelineHtml += `<div class="${cranClass}" title="${title}" onclick="selectCran(${c.id})" oncontextmenu="event.preventDefault(); deleteCran(${c.id});">${label}</div>`;
                });

                timelineHtml += '</div>';
            }

            dock.innerHTML = profilesHtml + dividerHtml + timelineHtml;
        }

        function obtenirSujetActif() {
            if (state.exerciseType === 'dissertation') {
                if (state.mode === 'argumentation') {
                    return state.activeThesis || '';
                } else {
                    if (state.isCustomDissertation) {
                        const inputCustom = document.getElementById("input-custom-sujet");
                        return inputCustom ? inputCustom.value.trim() : '';
                    } else {
                        const selectSujet = document.getElementById("select-sujet");
                        return selectSujet ? selectSujet.value : '';
                    }
                }
            } else if (state.exerciseType === 'explication') {
                if (state.mode === 'argumentation') {
                    return state.activeThesis || '';
                } else {
                    return state.currentExplicText ? (state.currentExplicText.label || state.currentExplicText.title || '') : '';
                }
            }
            return '';
        }

        function extrairePistesParBalise(html, scores) {
            const pistes = {};
            if (!html) return pistes;

            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            // Indexer les scores connus par nom normalisé
            const scoreMap = {};
            if (Array.isArray(scores)) {
                scores.forEach(s => {
                    if (s && s.name) {
                        const norm = s.name.trim().toUpperCase().replace(/[’'`]/g, "'").replace(/\s+/g, ' ');
                        scoreMap[norm] = typeof s.score === 'number' ? s.score : s.avg;
                    }
                });
            }

            // Recherche prioritaire par cartes de section
            const cards = doc.querySelectorAll('.section-feedback-card');
            if (cards.length > 0) {
                cards.forEach(card => {
                    const titleEl = card.querySelector('.section-card-title, h3');
                    const blockquote = card.querySelector('blockquote');
                    if (titleEl) {
                        const sectionName = titleEl.textContent.replace(/[\[\]]/g, '').trim();
                        const normName = sectionName.toUpperCase().replace(/[’'`]/g, "'").replace(/\s+/g, ' ');
                        
                        let note = scoreMap[normName];
                        if (typeof note !== 'number') {
                            const scorePill = card.querySelector('.section-score-pill');
                            const match = scorePill ? scorePill.textContent.match(/(\d+)\s*\/\s*100/) : null;
                            if (match) note = parseInt(match[1], 10);
                        }

                        const text = blockquote ? blockquote.textContent.trim() : "";
                        pistes[sectionName] = {
                            note: typeof note === 'number' && !isNaN(note) ? note : null,
                            conseil: text
                        };
                    }
                });
                return pistes;
            }

            // Recherche de repli par balises h3 standard
            const headers = doc.querySelectorAll('h3');
            headers.forEach(header => {
                const sectionName = header.textContent.replace(/[\[\]]/g, '').trim();
                const normName = sectionName.toUpperCase().replace(/\s+/g, ' ');
                let note = scoreMap[normName];

                let currentElement = header.nextElementSibling;
                let blockquote = null;
                while (currentElement && currentElement.tagName !== 'H3') {
                    if (!note) {
                        const match = currentElement.textContent.match(/(?:conformit[eé]|indice(?:\s+de\s+conformit[eé])?|m[eé]thodologie|note)[*\s]*[:*]+\s*(\d+)\s*\/\s*100/i);
                        if (match) note = parseInt(match[1], 10);
                    }
                    if (currentElement.tagName === 'BLOCKQUOTE') {
                        blockquote = currentElement;
                    } else {
                        const nestedBlockquote = currentElement.querySelector('blockquote');
                        if (nestedBlockquote) {
                            blockquote = nestedBlockquote;
                        }
                    }
                    currentElement = currentElement.nextElementSibling;
                }

                const text = blockquote ? blockquote.textContent.trim() : "";
                pistes[sectionName] = {
                    note: typeof note === 'number' && !isNaN(note) ? note : null,
                    conseil: text
                };
            });

            return pistes;
        }

        function getScoreColorClass(score) {
            if (score >= 90) return { bg: 'score-tier-1', bar: 'bar-tier-1', card: 'card-tier-1', pill: 'pill-tier-1', tier: 1 }; // Vert (90-100)
            if (score >= 75) return { bg: 'score-tier-2', bar: 'bar-tier-2', card: 'card-tier-2', pill: 'pill-tier-2', tier: 2 }; // Bleu (75-89)
            if (score >= 60) return { bg: 'score-tier-3', bar: 'bar-tier-3', card: 'card-tier-3', pill: 'pill-tier-3', tier: 3 }; // Ambre / Jaune (60-74)
            if (score >= 50) return { bg: 'score-tier-4', bar: 'bar-tier-4', card: 'card-tier-4', pill: 'pill-tier-4', tier: 4 }; // Orange (50-59)
            return { bg: 'score-tier-5', bar: 'bar-tier-5', card: 'card-tier-5', pill: 'pill-tier-5', tier: 5 };                   // Rouge (< 50)
        }

        function extraireTexteParSection(rawText) {
            const sections = {};
            if (!rawText || typeof rawText !== 'string') return sections;
            const regex = /\[([A-ZÀ-ÿ0-9\s'/–—]+)\]/gi;
            let match;
            const matches = [];
            while ((match = regex.exec(rawText)) !== null) {
                const cleanTag = match[1].trim().toUpperCase().replace(/[’'`]/g, "'").replace(/\s+/g, ' ');
                matches.push({ tag: cleanTag, index: match.index, length: match[0].length });
            }
            for (let i = 0; i < matches.length; i++) {
                const current = matches[i];
                const next = matches[i + 1];
                const start = current.index + current.length;
                const end = next ? next.index : rawText.length;
                const sectionContent = rawText.substring(start, end).trim();
                sections[current.tag] = sectionContent;
            }
            return sections;
        }

        function normaliserMarkdownCorrection(md) {
            if (!md || typeof md !== 'string') return '';
            // Détecter et restructurer proprement chaque bloc Pistes d'amélioration
            return md.replace(/(####\s*Pistes\s+d['’]am[ée]lioration[^\n]*\n)([\s\S]*?)(?=\n\s*(?:---|###|$)|$)/gi, (match, header, content) => {
                const rawLines = content.split('\n');
                const validLines = [];
                for (let line of rawLines) {
                    const trimmed = line.trim();
                    // Supprimer les chevrons isolés qui ouvrent/ferment des blockquotes vides
                    if (trimmed === '>' || trimmed === '') continue;
                    // Nettoyer les chevrons existants et ajouter un chevron standard par ligne
                    if (trimmed.startsWith('>')) {
                        const inner = trimmed.replace(/^>\s*/, '').trim();
                        if (inner) validLines.push('> ' + inner);
                    } else {
                        validLines.push('> ' + trimmed);
                    }
                }
                if (validLines.length === 0) {
                    return header + '> Aucune piste d\'amélioration significative.\n\n';
                }
                return header + validLines.join('\n') + '\n\n';
            });
        }

        function transformerRenduCorrection(rawHtml, previousCorrectionObj, currentDraftBySection) {
            if (!rawHtml) return { html: '', sections: [], globalScore: null };

            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            const headers = Array.from(doc.querySelectorAll('h3'));
            const sections = [];

            headers.forEach((header, idx) => {
                const sectionName = header.textContent.replace(/[\[\]]/g, '').trim();
                const sectionSlug = sectionName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || ('sec-' + idx);
                const sectionAnchorId = 'sec-eval-' + sectionSlug;

                // Collecter tous les nœuds frères appartenant à cette section jusqu'au prochain h3 ou h2
                const sectionNodes = [];
                let current = header.nextElementSibling;
                let scoreElement = null;
                let extractedScore = null;

                while (current && current.tagName !== 'H3' && current.tagName !== 'H2') {
                    const next = current.nextElementSibling;
                    const text = current.textContent;

                    // Repérer l'indice de conformité
                    const scoreMatch = text.match(/(?:conformit[eé]|indice(?:\s+de\s+conformit[eé])?|m[eé]thodologie|note)[*\s]*[:*]+\s*(\d+)\s*\/\s*100/i);

                    if (scoreMatch && extractedScore === null) {
                        extractedScore = parseInt(scoreMatch[1], 10);
                        scoreElement = current;
                    } else if (current.tagName === 'HR') {
                        // Supprimer les séparateurs hr horizontaux superflus
                        if (current.parentNode) current.parentNode.removeChild(current);
                    } else if (current.tagName === 'P' && /^[*\s]*(?:[eé]valuation|indice\s+de\s+conformit[eé])\b/i.test(text.trim())) {
                        if (current.parentNode) current.parentNode.removeChild(current);
                    } else {
                        sectionNodes.push(current);
                    }

                    current = next;
                }

                // Si un score a été détecté pour cette section
                if (extractedScore !== null && !isNaN(extractedScore)) {
                    let finalScore = extractedScore;

                    // Recherche de la note précédente pour calculer l'indicateur d'évolution (évaluation 100% souveraine sans verrouillage)
                    const normSection = sectionName.toUpperCase().replace(/[’'`]/g, "'").replace(/\s+/g, ' ');
                    const prevScoreObj = (previousCorrectionObj && Array.isArray(previousCorrectionObj.scores))
                        ? previousCorrectionObj.scores.find(s => s && s.name && s.name.toUpperCase().replace(/[’'`]/g, "'").replace(/\s+/g, ' ') === normSection)
                        : null;

                    // Calcul de l'indicateur d'évolution pour cette section
                    let sectionDeltaHtml = '';
                    if (prevScoreObj) {
                        const prevScoreVal = typeof prevScoreObj.score === 'number' ? prevScoreObj.score : prevScoreObj.avg;
                        if (typeof prevScoreVal === 'number' && !isNaN(prevScoreVal)) {
                            const diff = finalScore - prevScoreVal;
                            if (diff > 0) {
                                sectionDeltaHtml = `<span class="section-score-delta delta-positive" title="Précédent : ${prevScoreVal}/100">▲ +${diff} pt${diff > 1 ? 's' : ''}</span>`;
                            } else if (diff < 0) {
                                sectionDeltaHtml = `<span class="section-score-delta delta-negative" title="Précédent : ${prevScoreVal}/100">▼ ${diff} pt${Math.abs(diff) > 1 ? 's' : ''}</span>`;
                            } else {
                                sectionDeltaHtml = `<span class="section-score-delta delta-neutral" title="Identique : ${prevScoreVal}/100">■ 0 pt</span>`;
                            }
                        }
                    }

                    sections.push({
                        name: sectionName,
                        score: finalScore,
                        avg: finalScore,
                        anchorId: sectionAnchorId
                    });

                    const scoreColors = getScoreColorClass(finalScore);

                    // Créer la carte de section complète englobante
                    const cardDiv = doc.createElement('div');
                    cardDiv.className = `section-feedback-card ${scoreColors.card}`;
                    cardDiv.id = sectionAnchorId;

                    // En-tête intégré moderne de la carte avec indicateur d'évolution à gauche de la note
                    const cardHeader = doc.createElement('div');
                    cardHeader.className = 'section-card-header';
                    cardHeader.innerHTML = `
                        <h3 class="section-card-title">[${sectionName}]</h3>
                        <div class="section-card-bar-wrap">
                            <div class="section-eval-bar-container">
                                <div class="section-eval-bar-fill ${scoreColors.bar}" style="width: ${finalScore}%;"></div>
                            </div>
                        </div>
                        <div class="section-card-score-wrap">
                            ${sectionDeltaHtml}
                            <span class="section-score-pill ${scoreColors.bg}">${finalScore} / 100</span>
                        </div>
                    `;
                    cardDiv.appendChild(cardHeader);

                    // Déplacer les nœuds de contenu (Analyse, Pistes, etc.) à l'intérieur de la carte
                    sectionNodes.forEach(node => {
                        cardDiv.appendChild(node);
                    });

                    // Nettoyage des blockquotes vides et regroupement robuste des pistes orphelines
                    cardDiv.querySelectorAll('blockquote').forEach(bq => {
                        if (!bq.textContent.trim()) {
                            if (bq.parentNode) bq.parentNode.removeChild(bq);
                        }
                    });

                    const h4Pistes = Array.from(cardDiv.querySelectorAll('h4')).find(h => /Pistes\s+d['’]am[ée]lioration/i.test(h.textContent));
                    if (h4Pistes) {
                        let el = h4Pistes.nextElementSibling;
                        let targetBq = cardDiv.querySelector('blockquote');
                        while (el) {
                            const next = el.nextElementSibling;
                            if (el.tagName === 'BLOCKQUOTE') {
                                if (!el.textContent.trim()) {
                                    if (el.parentNode) el.parentNode.removeChild(el);
                                } else {
                                    targetBq = el;
                                }
                            } else if (['UL', 'OL', 'P'].includes(el.tagName)) {
                                if (!targetBq) {
                                    targetBq = doc.createElement('blockquote');
                                    h4Pistes.parentNode.insertBefore(targetBq, el);
                                }
                                targetBq.appendChild(el);
                            }
                            el = next;
                        }
                    }

                    // Supprimer l'élément brut de score s'il existe
                    if (scoreElement && scoreElement.parentNode) {
                        scoreElement.parentNode.removeChild(scoreElement);
                    }

                    // Remplacer le h3 d'origine par la carte complète
                    if (header.parentNode) {
                        header.parentNode.replaceChild(cardDiv, header);
                    }
                }
            });

            // Construction du tableau de bord global en tête si des sections sont évaluées
            let globalScore = null;
            if (sections.length > 0) {
                globalScore = Math.round(sections.reduce((acc, s) => acc + s.score, 0) / sections.length);
                const globalColors = getScoreColorClass(globalScore);

                let deltaHtml = '';
                if (previousCorrectionObj && typeof previousCorrectionObj.globalScore === 'number') {
                    const diff = globalScore - previousCorrectionObj.globalScore;
                    if (diff > 0) {
                        deltaHtml = `<span class="score-delta-badge delta-positive">▲ +${diff} pts (précédent : ${previousCorrectionObj.globalScore}/100)</span>`;
                    } else if (diff < 0) {
                        deltaHtml = `<span class="score-delta-badge delta-negative">▼ ${diff} pts (précédent : ${previousCorrectionObj.globalScore}/100)</span>`;
                    } else {
                        deltaHtml = `<span class="score-delta-badge delta-neutral">■ 0 pt (identique : ${previousCorrectionObj.globalScore}/100)</span>`;
                    }
                }

                const chipsHtml = sections.map(s => {
                    const c = getScoreColorClass(s.score);
                    return `<a href="#${s.anchorId}" class="section-chip" data-target="${s.anchorId}">${s.name} <span class="section-chip-score ${c.bg}">${s.score}/100</span></a>`;
                }).join('');

                const dashboardDiv = doc.createElement('div');
                dashboardDiv.className = `global-eval-dashboard dashboard-tier-${globalColors.tier}`;
                dashboardDiv.innerHTML = `
                    <div class="dashboard-header">
                        <div class="dashboard-title">
                            <span>Indice général de conformité</span>
                        </div>
                        <div class="dashboard-score-wrap">
                            ${deltaHtml}
                            <span class="global-score-badge ${globalColors.bg}" title="Cliquez pour afficher le haut de la correction" data-target="correction-box">${globalScore} / 100</span>
                        </div>
                    </div>
                    <div class="dashboard-sections-summary">
                        ${chipsHtml}
                    </div>
                `;

                doc.body.insertBefore(dashboardDiv, doc.body.firstChild);
            }

            return {
                html: doc.body.innerHTML,
                sections,
                globalScore
            };
        }

        // Génération d'abréviations courtes et intelligentes pour les pastilles de sections
        function getShortSectionCode(sectionName) {
            if (!sectionName || typeof sectionName !== 'string') return '';
            const s = sectionName.toUpperCase().trim();
            if (s.startsWith('ARGUMENT')) {
                const num = s.match(/\d+/);
                return num ? 'A' + num[0] : 'Arg';
            }
            if (s.startsWith('RÉF') || s.startsWith('REF') || s.startsWith('EXEMPLE')) {
                const num = s.match(/\d+/);
                return num ? 'R' + num[0] : 'R';
            }
            if (s.includes('SOUS-MOMENT') || s.includes('MOMENT')) {
                const num = s.match(/\d+/);
                return num ? 'SM' + num[0] : 'SM';
            }
            if (s === 'THÈSE' || s === 'THESE') return 'T';
            if (s === 'THÈME' || s === 'THEME') return 'Th';
            if (s === 'AMORCE') return 'A';
            if (s === 'SUJET') return 'S';
            if (s.startsWith('ÉVIDENCE') || s.startsWith('EVIDENCE')) return 'EDC';
            if (s.startsWith('CONTRADICTION')) return 'CL';
            if (s.startsWith('PROBLÉMATIQUE') || s.startsWith('PROBLEMATIQUE') || s === 'PROBLÈME' || s === 'PROBLEME') return 'Pb';
            if (s.startsWith('ANNONCE') || s.includes('PLAN')) return 'AP';
            if (s.startsWith('LIGNE')) return 'LD';
            if (s.startsWith('ENJEU')) return 'Enj';
            if (s.startsWith('CONCLUSION')) return 'C';
            if (s.startsWith('OBJECTION')) return 'Obj';
            if (s.startsWith('TRANSITION')) return 'Tr';
            if (s.startsWith('REFORMULATION')) return 'Rf';
            return s.charAt(0);
        }

        function scrollToElement(id) {
            if (!id) return;
            const el = document.getElementById(id);
            if (el) {
                const yOffset = -20;
                const elementPosition = el.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset + yOffset;
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        // Mise à jour dynamique de la barre de navigation rapide flottante (Desktop & Mobile)
        function updateFloatingQuickNav(sectionsList, globalScore) {
            let nav = document.getElementById('floating-quicknav');
            if (!nav) {
                nav = document.createElement('div');
                nav.id = 'floating-quicknav';
                nav.className = 'floating-quicknav';
                document.body.appendChild(nav);
            }

            const isExplication = state.exerciseType === 'explication';
            let html = '';

            if (isExplication) {
                html += `<button type="button" class="quicknav-btn" data-tooltip="Revenir au texte de l'auteur" onclick="scrollToElement('texte-philo-container'); return false;">📖</button>`;
            }

            html += `<button type="button" class="quicknav-btn" data-tooltip="Revenir à la zone de rédaction" onclick="scrollToElement('training-section-container'); return false;">✍️</button>`;

            const validSections = Array.isArray(sectionsList) ? sectionsList.filter(s => s && typeof s.score === 'number') : [];

            // Calculer ou récupérer le score global de conformité
            let finalGlobalScore = (typeof globalScore === 'number') ? globalScore : null;
            if (finalGlobalScore === null && validSections.length > 0) {
                finalGlobalScore = Math.round(validSections.reduce((acc, s) => acc + s.score, 0) / validSections.length);
            }

            // Pastille d'indice général de conformité (placée juste sous le bouton Saisie)
            if (typeof finalGlobalScore === 'number') {
                const globalColors = getScoreColorClass(finalGlobalScore);
                html += `<a href="#correction-box" class="quicknav-global-pill ${globalColors.pill}" data-tooltip="Indice général de conformité : ${finalGlobalScore}/100" data-target="correction-box" onclick="scrollToElement('correction-box'); return false;">${finalGlobalScore}</a>`;
            }

            if (validSections.length > 0) {
                html += `<div class="quicknav-divider"></div>`;
                validSections.forEach(s => {
                    const shortCode = getShortSectionCode(s.name);
                    const colors = getScoreColorClass(s.score);
                    html += `<a href="#${s.anchorId}" class="quicknav-section-pill ${colors.pill}" data-tooltip="${s.name} — ${s.score}/100" data-target="${s.anchorId}" onclick="scrollToElement('${s.anchorId}'); return false;">${shortCode}</a>`;
                });
            }

            if (nav.innerHTML !== html) {
                nav.innerHTML = html;
            }
        }
