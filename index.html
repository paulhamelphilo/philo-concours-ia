        function syncSelections(oldMode, newMode) {
            if (state.exerciseType === 'dissertation') {
                if ((oldMode === 'intro' || oldMode === 'dev') && newMode === 'argumentation') {
                    // Standard -> Argumentation
                    state.isCustomArgumentation = state.isCustomDissertation;

                    const inputCustomSujet = document.getElementById("input-custom-sujet");
                    const inputCustomThesis = document.getElementById("input-custom-thesis");
                    if (inputCustomSujet && inputCustomThesis) {
                        inputCustomThesis.value = inputCustomSujet.value;
                    }

                    if (!state.isCustomDissertation) {
                        const selectNotion = document.getElementById("select-notion");
                        const selectSujet = document.getElementById("select-sujet");
                        const selectNotionArg = document.getElementById("select-notion-arg");
                        const selectSujetArg = document.getElementById("select-sujet-arg");

                        if (selectNotion && selectNotionArg) {
                            const notion = selectNotion.value;
                            selectNotionArg.value = notion;
                            updateSujetsArg();

                            if (selectSujet && selectSujetArg && notion) {
                                const question = selectSujet.value;
                                if (sujetsPhilo[notion]) {
                                    const idx = sujetsPhilo[notion].findIndex(s => s.question === question);
                                    if (idx !== -1) {
                                        selectSujetArg.value = idx;
                                        updateArgThesisButtons();
                                    }
                                }
                            }
                        }
                    } else {
                        updateCustomArgPosition();
                    }
                } else if (oldMode === 'argumentation' && (newMode === 'intro' || newMode === 'dev')) {
                    // Argumentation -> Standard
                    state.isCustomDissertation = state.isCustomArgumentation;

                    const pre = document.getElementById('dissertation-predefined');
                    const cust = document.getElementById('dissertation-custom');
                    if (pre && cust) {
                        pre.style.display = state.isCustomDissertation ? 'none' : 'block';
                        cust.style.display = state.isCustomDissertation ? 'block' : 'none';
                    }

                    const inputCustomSujet = document.getElementById("input-custom-sujet");
                    const inputCustomThesis = document.getElementById("input-custom-thesis");
                    if (inputCustomSujet && inputCustomThesis) {
                        inputCustomSujet.value = inputCustomThesis.value;
                    }

                    if (!state.isCustomArgumentation) {
                        const selectNotion = document.getElementById("select-notion");
                        const selectSujet = document.getElementById("select-sujet");
                        const selectNotionArg = document.getElementById("select-notion-arg");
                        const selectSujetArg = document.getElementById("select-sujet-arg");

                        if (selectNotion && selectNotionArg) {
                            const notion = selectNotionArg.value;
                            selectNotion.value = notion;
                            updateSujets();

                            if (selectSujet && selectSujetArg && notion) {
                                const idx = parseInt(selectSujetArg.value, 10);
                                if (!isNaN(idx) && sujetsPhilo[notion] && sujetsPhilo[notion][idx]) {
                                    selectSujet.value = sujetsPhilo[notion][idx].question;
                                }
                            }
                        }
                    }
                }
            } else if (state.exerciseType === 'explication') {
                if ((oldMode === 'intro' || oldMode === 'dev') && newMode === 'argumentation') {
                    // Standard -> Argumentation
                    state.isCustomExplicationArg = state.isCustomExplication;

                    const inputCustomAuthor = document.getElementById("input-custom-author");
                    const inputCustomWork = document.getElementById("input-custom-work");
                    const textareaCustomText = document.getElementById("textarea-custom-text");

                    const inputCustomArgAuthor = document.getElementById("input-custom-arg-author");
                    const inputCustomArgWork = document.getElementById("input-custom-arg-work");
                    const textareaCustomArgFragment = document.getElementById("textarea-custom-arg-fragment");

                    if (inputCustomAuthor && inputCustomArgAuthor) {
                        inputCustomArgAuthor.value = inputCustomAuthor.value;
                    }
                    if (inputCustomWork && inputCustomArgWork) {
                        inputCustomArgWork.value = inputCustomWork.value;
                    }
                    if (textareaCustomText && textareaCustomArgFragment) {
                        textareaCustomArgFragment.value = textareaCustomText.value;
                    }

                    const preArg = document.getElementById('explication-arg-predefined');
                    const custArg = document.getElementById('explication-arg-custom');
                    if (preArg && custArg) {
                        preArg.style.display = state.isCustomExplicationArg ? 'none' : 'block';
                        custArg.style.display = state.isCustomExplicationArg ? 'block' : 'none';
                    }

                    if (!state.isCustomExplicationArg) {
                        if (state.currentExplicTextIndex !== null) {
                            const idx = state.currentExplicTextIndex;
                            if (!state.activeFragment || state.activeFragment.textIndex !== idx) {
                                state.activeFragment = { textIndex: idx, momentIndex: 0, subMomentIndex: 0 };
                            }
                            const textData = state.explicTexts[idx];
                            if (textData && textData.structure && textData.structure[state.activeFragment.momentIndex]) {
                                state.activeThesis = textData.structure[state.activeFragment.momentIndex].subMoments[state.activeFragment.subMomentIndex];
                                state.thesisOrientation = 'fragment';
                            } else {
                                state.activeThesis = null;
                                state.thesisOrientation = null;
                            }
                        }
                    } else {
                        updateCustomExplicationArg();
                    }
                } else if (oldMode === 'argumentation' && (newMode === 'intro' || newMode === 'dev')) {
                    // Argumentation -> Standard
                    state.isCustomExplication = state.isCustomExplicationArg;

                    const preExp = document.getElementById('explication-predefined');
                    const custExp = document.getElementById('explication-custom');
                    if (preExp && custExp) {
                        preExp.style.display = state.isCustomExplication ? 'none' : 'block';
                        custExp.style.display = state.isCustomExplication ? 'block' : 'none';
                    }

                    const inputCustomAuthor = document.getElementById("input-custom-author");
                    const inputCustomWork = document.getElementById("input-custom-work");
                    const textareaCustomText = document.getElementById("textarea-custom-text");

                    const inputCustomArgAuthor = document.getElementById("input-custom-arg-author");
                    const inputCustomArgWork = document.getElementById("input-custom-arg-work");
                    const textareaCustomArgFragment = document.getElementById("textarea-custom-arg-fragment");

                    if (inputCustomAuthor && inputCustomArgAuthor) {
                        inputCustomAuthor.value = inputCustomArgAuthor.value;
                    }
                    if (inputCustomWork && inputCustomArgWork) {
                        inputCustomWork.value = inputCustomArgWork.value;
                    }
                    if (textareaCustomText && textareaCustomArgFragment) {
                        textareaCustomText.value = textareaCustomArgFragment.value;
                    }

                    if (!state.isCustomExplicationArg) {
                        if (state.activeFragment && state.activeFragment.textIndex !== null) {
                            const idx = state.activeFragment.textIndex;
                            state.currentExplicTextIndex = idx;
                            state.currentExplicText = state.explicTexts[idx];
                        }
                    } else {
                        updateCustomExplication();
                    }
                }
            }
        }

        function populateSujetsConcours() {
            const selectSujet = document.getElementById("select-sujet");
            if (!selectSujet) return;
            selectSujet.innerHTML = '';

            const defaultOpt = document.createElement("option");
            defaultOpt.value = "";
            defaultOpt.textContent = "-- Sélectionnez une annale (" + state.concours + ") ou un sujet d’entraînement --";
            selectSujet.appendChild(defaultOpt);

            // 1. Groupe des annales officielles du concours actif
            const cData = CONCOURS_ANNALES[state.concours];
            if (cData && Array.isArray(cData.dissertation) && cData.dissertation.length > 0) {
                const groupAnn = document.createElement("optgroup");
                groupAnn.label = "🏛️ Annales officielles (" + state.concours + " 2020-2026)";
                cData.dissertation.forEach(item => {
                    const opt = document.createElement("option");
                    opt.value = item.title || item.label;
                    opt.textContent = item.label;
                    groupAnn.appendChild(opt);
                });
                selectSujet.appendChild(groupAnn);
            }

            // 2. Groupe des sujets d'entraînement notionnels
            if (typeof sujetsPhilo === 'object') {
                const groupNotions = document.createElement("optgroup");
                groupNotions.label = "📚 Sujets d’entraînement par notion";
                Object.keys(sujetsPhilo).forEach(n => {
                    sujetsPhilo[n].forEach(s => {
                        const opt = document.createElement("option");
                        opt.value = s.question;
                        opt.textContent = `[${n}] ${s.question}`;

                selectSujet.appendChild(groupNotions);

            selectSujet.disabled = false;

            const sel = document.getElementById('select-explic-text');

            sel.innerHTML = '<option value="">-- Sélectionnez un texte --</option>' +
                state.explicTexts.map((t, i) => `<option value="${i}">${t.label}</option>`).join('');

        function loadExplicationsFromJSON(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    state.explicTexts = JSON.parse(evt.target.result);
                    state.currentExplicTextIndex = null;
                    state.currentExplicText = null;
                    populateExplicTextSelector();
                    console.log(`✓ ${state.explicTexts.length} texte(s) chargé(s)`);
                } catch (err) {
                    alert('Erreur lors de la lecture du JSON : ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function selectExplicText(val) {
            saveCurrentDraftToLastRenderedSubject();
            if (!val) {
                state.currentExplicTextIndex = null;
                state.currentExplicText = null;
                render();
                return;
            }

            if (val.startsWith("annale_")) {
                const aIdx = parseInt(val.replace("annale_", ""), 10);
                const cData = CONCOURS_ANNALES[state.concours];
                if (cData && cData.explication && cData.explication[aIdx]) {
                    const annale = cData.explication[aIdx];
                    state.currentExplicTextIndex = val;
                    state.currentExplicText = {
                        author: annale.title || annale.label,
                        work: state.concours + " (" + annale.session + ")",
                        label: annale.label,
                        source: annale.label,
                        html: `<div style="white-space: pre-wrap; font-family: inherit; font-size: 1.05em; line-height: 1.8;">${annale.content}</div>`
                    };
                }
            } else {
                const idx = parseInt(val, 10);
                if (isNaN(idx) || idx < 0 || idx >= state.explicTexts.length) {
                    state.currentExplicTextIndex = null;
                    state.currentExplicText = null;
                } else {
                    state.currentExplicTextIndex = idx;
                    state.currentExplicText = state.explicTexts[idx];
                }
            }
            render();
        }

        function getCharCountInfo(len, max) {
            let label = `${len} / ${max} caractères`;

                label += ' 🚫 (limite atteinte)';
                color = '#0f4c81';
                fontWeight = 'bold';
            } else if (len >= max * 0.9) {
                label += ' ⚠️ (limite presque atteinte)';
                color = '#d35400';
                fontWeight = 'bold';
            }

            return { label, color, fontWeight };
        }

        function updateCharCount(textarea) {
            const counter = document.getElementById('char-count');
            if (counter) {
                const info = getCharCountInfo(textarea.value.length, textarea.maxLength);

                counter.style.color = info.color;

            }
        }

        function preserveAndCount(textarea) {
            if (textarea && typeof textarea.value === 'string' && !textarea.value.startsWith("    ")) {
                const oldStart = textarea.selectionStart;
                const oldEnd = textarea.selectionEnd;
                const stripped = textarea.value.replace(/^\s*/, '');
                textarea.value = "    " + stripped;
                textarea.selectionStart = Math.max(4, oldStart + 4);
                textarea.selectionEnd = Math.max(4, oldEnd + 4);
            }
            saveCurrentDraftToLastRenderedSubject();
            updateCharCount(textarea);
        }

        function handleTextareaKeydown(e, textarea) {
            const INDENT = "    "; // 4 espaces d'alinéa typographique

            if (e.key === 'Enter') {
                e.preventDefault();
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const insert = '\n' + INDENT;

                let handled = false;
                try {
                    if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
                        handled = document.execCommand('insertText', false, insert);
                    }
                } catch (err) {
                    handled = false;
                }

                if (!handled) {
                    textarea.setRangeText(insert, start, end, 'end');
                }

                preserveAndCount(textarea);
                return;
            }

            // Si une sélection incluant le tout début du texte est effacée (ex: Ctrl+A + Backspace/Delete),
            // on conserve toujours le premier alinéa de 4 espaces quoi qu'il arrive
            if ((e.key === 'Backspace' || e.key === 'Delete') && textarea.selectionStart === 0 && textarea.selectionEnd > 0) {
                e.preventDefault();
                textarea.setRangeText(INDENT, 0, textarea.selectionEnd, 'end');
                preserveAndCount(textarea);
                return;
            }

            if (e.key === 'Backspace') {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                // Si du texte est sélectionné, comportement standard de Backspace (suppression de la sélection)
                if (start !== end) {
                    return;
                }

                const val = textarea.value;
                const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                const lineEnd = val.indexOf('\n', start);
                const actualLineEnd = lineEnd === -1 ? val.length : lineEnd;
                const currentLine = val.substring(lineStart, actualLineEnd);
                const leadingMatch = currentLine.match(/^\s+/);
                const leadingSpacesCount = leadingMatch ? leadingMatch[0].length : 0;

                // Si le curseur se trouve dans la zone d'alinéa en début de ligne
                if (start <= lineStart + leadingSpacesCount) {
                    e.preventDefault();
                    if (lineStart > 0) {
                        // Lignes 2 et suivantes : supprime le saut de ligne précédent et l'alinéa pour revenir à la ligne du dessus
                        textarea.setRangeText('', lineStart - 1, lineStart + leadingSpacesCount, 'end');
                        preserveAndCount(textarea);
                    } else {
                        // Première ligne : l'alinéa initial reste quoi qu'il arrive
                        textarea.selectionStart = textarea.selectionEnd = leadingSpacesCount;
                    }
                    return;
                }
            }

            if (e.key === 'Delete') {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                // Empêche la touche Suppr d'effacer les espaces du premier alinéa si le curseur est placé avant
                if (start === end && start < 4 && !textarea.value.substring(0, start).includes('\n')) {
                    const lineEnd = textarea.value.indexOf('\n');
                    const firstLine = lineEnd === -1 ? textarea.value : textarea.value.substring(0, lineEnd);
                    const lead = firstLine.match(/^\s+/);
                    if (lead && start < lead[0].length) {
                        e.preventDefault();
                        textarea.selectionStart = textarea.selectionEnd = lead[0].length;
                        return;
                    }
                }

                if (start === end && start < textarea.value.length && textarea.value[start] === '\n') {
                    const nextLine = textarea.value.substring(start + 1);
                    const leadingMatch = nextLine.match(/^\s+/);
                    if (leadingMatch && leadingMatch[0].length > 0) {
                        e.preventDefault();
                        textarea.setRangeText('', start, start + 1 + leadingMatch[0].length, 'end');
                        preserveAndCount(textarea);
                        return;
                    }
                }
            }
        }

        async function envoyerCorrection() {
            let sujet = '';
            let selectedTextHtml = null;
            let selectedTextTitle = null;
            let thesisOrientation = null;
            let positionTexte = null;

            if (state.exerciseType === 'dissertation') {
                if (state.mode === 'argumentation') {
                    if (!state.activeThesis) {
                        alert("Veuillez choisir ou saisir une thèse à défendre avant de demander la correction.");
                        return;
                    }
                    thesisOrientation = state.thesisOrientation;
                    positionTexte = state.activeThesis;
                    if (!state.isCustomArgumentation) {
                        const notion = document.getElementById("select-notion-arg").value;
                        const idx = parseInt(document.getElementById("select-sujet-arg").value, 10);
                        if (notion && !isNaN(idx)) {
                            sujet = sujetsPhilo[notion][idx].question;
                        }
                    } else {
                        sujet = "Thèse personnalisée";
                    }
                } else {
                    if (state.isCustomDissertation) {
                        sujet = document.getElementById("input-custom-sujet").value.trim();
                        if (!sujet) {
                            alert("Veuillez saisir votre sujet personnalisé avant de demander la correction.");
                            return;
                        }
                    } else {
                        sujet = document.getElementById("select-sujet").value;
                        if (!sujet) {
                            alert("Veuillez sélectionner un sujet avant de demander la correction.");
                            return;
                        }
                    }
                }
            } else if (state.exerciseType === 'explication') {
                if (state.mode === 'argumentation') {
                    if (!state.activeThesis) {
                        if (state.isCustomExplicationArg) {
                            alert("Veuillez saisir le fragment à expliquer avant de demander la correction.");
                        } else {
                            alert("Veuillez choisir un fragment à expliquer avant de demander la correction.");
                        }
                        return;
                    }
                    thesisOrientation = 'fragment';
                    positionTexte = state.activeThesis;
                    sujet = "Fragment de texte";
                } else {
                    // Explication de texte standard
                    if (!state.currentExplicText) {
                        if (state.isCustomExplication) {
                            alert("Veuillez saisir le texte à expliquer avant de demander la correction.");
                        } else {
                            alert("Veuillez sélectionner un texte en haut de la page avant de demander la correction.");
                        }
                        return;
                    }
                    if (state.currentExplicText.structure) {
                        const starts = state.currentExplicText.paragraphStarts || [[0, 0]];
                        const isParagraphStart = (m, s) => starts.some(coord => coord[0] === m && coord[1] === s);
                        let textHtml = "";
                        let inParagraph = false;
                        state.currentExplicText.structure.forEach((moment, mIdx) => {
                            moment.subMoments.forEach((sub, sIdx) => {
                                const isStart = isParagraphStart(mIdx, sIdx);
                                if (isStart) {
                                    if (inParagraph) {
                                        textHtml += `</p>`;
                                    }
                                    textHtml += `<p style="margin-bottom: 15px;">`;
                                    inParagraph = true;
                                } else {
                                    textHtml += " ";
                                }
                                textHtml += sub;
                            });
                        });
                        if (inParagraph) {
                            textHtml += `</p>`;
                        }
                        selectedTextHtml = textHtml;
                        if (state.currentExplicText.source) {
                            selectedTextHtml += `<p style="text-align: right; margin-top: 15px; color: #475569;">${state.currentExplicText.source}</p>`;
                        }
                        if (state.currentExplicText.notes) {
                            selectedTextHtml += `<div style="margin-top: 15px; color: #475569;">${state.currentExplicText.notes}</div>`;
                        }
                    } else {
                        selectedTextHtml = state.currentExplicText.html || "";
                    }
                    selectedTextTitle = state.currentExplicText.label || state.currentExplicText.title;
                }
            }

            let trainingText = document.getElementById("training-textarea") ? document.getElementById("training-textarea").value.trim() : '';
            if (!trainingText) {
                alert("Veuillez rédiger votre texte d’entraînement avant d’envoyer.");
                return;
            }

            const cleanTextForValidation = trainingText.replace(/\[[^\]]+\]/g, '').trim();
            if (cleanTextForValidation.length < 10) {
                alert("Veuillez rédiger votre travail avant de demander la correction.");
                return;
            }

            const sujetActif = obtenirSujetActif();
            const currentSubKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
            const storedCorrection = getSubjectStoredDraftAndCorrection(state.exerciseType, state.mode, sujetActif);
            const normStoredSub = storedCorrection.correction && storedCorrection.correction.sujet ? getSubjectStorageKey(state.exerciseType, state.mode, storedCorrection.correction.sujet) : currentSubKey;
            const savedCorrectionObj = (storedCorrection.correction && storedCorrection.correction.html && sujetActif !== '' && normStoredSub === currentSubKey) ? storedCorrection.correction : null;

            // Évaluation souveraine et équitable : chaque copie est évaluée en soi, de manière anonyme et absolue.
            // On ne transmet aucun historique de notation au serveur pour garantir qu'à saisie identique, la note soit identique.

            // Visuel de chargement
            const btnSubmit = document.querySelector(".btn-submit");
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = "⏳ Analyse en cours<span class='loading-dots'></span>";
                btnSubmit.style.opacity = "0.6";
                btnSubmit.style.cursor = "not-allowed";
            }

            document.getElementById("loading-msg").style.display = "block";
            document.getElementById("correction-box").style.display = "none";

            try {
                // Détermine les bons paramètres en fonction du mode d'argumentation ou standard
                const body = {
                    sujet,
                    concours: state.concours,
                    type: state.mode === 'argumentation' ? 'argumentation' : state.exerciseType,
                    mode: state.mode,
                    texte: trainingText
                };
                if (state.exerciseType === 'explication' && state.mode !== 'argumentation') {
                    body.selectedTextTitle = selectedTextTitle;
                    body.selectedTextHtml = selectedTextHtml;
                }
                if (state.mode === 'argumentation') {
                    body.thesisOrientation = thesisOrientation;
                    body.positionTexte = positionTexte;
                    body.argumentationSubMode = state.exerciseType === 'explication' ? 'fragment' : 'dissertation';
                }

                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept-Encoding": "identity"
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) throw new Error("Le serveur a rencontré un problème.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                document.getElementById("correction-text").innerHTML = "";
                document.getElementById("correction-box").style.display = "block";
                document.getElementById("correction-box").scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

                let texteCumule = "";
                const currentDraftBySection = extraireTexteParSection(trainingText);

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        texteCumule += chunk;
                        const intermediateHtml = marked.parse(normaliserMarkdownCorrection(texteCumule));
                        const intermediateTransformed = transformerRenduCorrection(intermediateHtml, savedCorrectionObj, currentDraftBySection);
                        document.getElementById("correction-text").innerHTML = intermediateTransformed.html;
                        updateFloatingQuickNav(intermediateTransformed.sections, intermediateTransformed.globalScore);
                    }
                } catch (streamError) {
                    texteCumule += "\n\n[Erreur de connexion : le flux a été interrompu par le réseau. Veuillez réessayer si la correction est incomplète.]";
                    const errHtml = marked.parse(normaliserMarkdownCorrection(texteCumule));
                    const errTransformed = transformerRenduCorrection(errHtml, savedCorrectionObj, currentDraftBySection);
                    document.getElementById("correction-text").innerHTML = errTransformed.html;
                    updateFloatingQuickNav(errTransformed.sections, errTransformed.globalScore);
                }

                const correctionHtmlFinale = marked.parse(normaliserMarkdownCorrection(texteCumule));
                const transformedFinal = transformerRenduCorrection(correctionHtmlFinale, savedCorrectionObj, currentDraftBySection);
                document.getElementById("correction-text").innerHTML = transformedFinal.html;
                updateFloatingQuickNav(transformedFinal.sections, transformedFinal.globalScore);

                const newCorrectionObj = {
                    sujet: sujetActif,
                    html: transformedFinal.html,
                    rawMarkdown: texteCumule,
                    scores: transformedFinal.sections,
                    globalScore: transformedFinal.globalScore,
                    draftBySection: currentDraftBySection
                };
                
                const currentSubjectKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
                const prof = getActiveProfile();
                if (!prof.subjectsData[currentSubjectKey]) {
                    prof.subjectsData[currentSubjectKey] = {
                        activeCranId: 'draft',
                        draftParentId: null,
                        workingDraft: '',
                        crans: [],
                        updatedAt: Date.now()
                    };
                }
                const entry = prof.subjectsData[currentSubjectKey];
                if (!Array.isArray(entry.crans)) {
                    entry.crans = [];
                }

                // Détermination du parent pour l'insertion par filiation (Option 2)
                let parentId = null;
                if (typeof entry.activeCranId === 'number') {
                    parentId = entry.activeCranId;
                } else if (entry.draftParentId) {
                    parentId = entry.draftParentId;
                } else if (entry.crans.length > 0) {
                    parentId = entry.crans[0].id;
                }

                // Génération d'un nouvel identifiant séquentiel de cran
                const maxId = entry.crans.length > 0 ? Math.max(...entry.crans.map(c => c.id || 0)) : 0;
                const newCranId = maxId + 1;

                const now = new Date();
                const timeLabel = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const score = (typeof transformedFinal.globalScore === 'number') ? transformedFinal.globalScore : null;

                const newCran = {
                    id: newCranId,
                    parentId: parentId,
                    timestamp: Date.now(),
                    timeLabel: timeLabel,
                    score: score,
                    draft: trainingText,
                    correction: newCorrectionObj
                };

                entry.crans = insertCranAboveParent(entry.crans, newCran, parentId);
                entry.activeCranId = newCranId;
                entry.draftParentId = newCranId;
                entry.workingDraft = trainingText;
                entry.hideDraftCorrection = false;
                entry.updatedAt = Date.now();

                updateLastActiveState();
                persistStorageData();
                updateFloatingProfileDock();
            } catch (error) {
                alert("Erreur lors de la communication avec le correcteur : " + error.message);
            } finally {
                document.getElementById("loading-msg").style.display = "none";
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Correction IA";
                    btnSubmit.style.opacity = "1";
                    btnSubmit.style.cursor = "pointer";
                }
            }
        }

        function updateSujetsArg() {
            saveCurrentDraftToLastRenderedSubject();
            const notion = document.getElementById("select-notion-arg").value;
            const selectSujet = document.getElementById("select-sujet-arg");
            selectSujet.innerHTML = '<option value="">-- Sélectionnez un sujet --</option>';

            // Hide buttons and clear selection state since the notion changed
            document.getElementById('btn-arg-thesis').style.display = 'none';
            document.getElementById('btn-arg-antithesis').style.display = 'none';
            const container = document.getElementById('arg-buttons-container');
            if (container) container.style.display = 'none';
            state.activeThesis = null;
            state.thesisOrientation = null;
            updateDisplaySelectedThesis();

            if (notion) {
                selectSujet.disabled = false;
                selectSujet.innerHTML = '<option value="">-- Sélectionnez un sujet d’étude --</option>';
                sujetsPhilo[notion].forEach((s, idx) => {
                    const opt = document.createElement("option");
                    opt.value = idx;
                    opt.textContent = s.question;
                    selectSujet.appendChild(opt);
                });
            } else {
                selectSujet.disabled = true;
            }
            render();
        }

        function updateArgThesisButtons() {
            saveCurrentDraftToLastRenderedSubject();
            const notion = document.getElementById("select-notion-arg").value;
            const idx = parseInt(document.getElementById("select-sujet-arg").value, 10);

            const btnThesis = document.getElementById('btn-arg-thesis');
            const btnAntithesis = document.getElementById('btn-arg-antithesis');
            const container = document.getElementById('arg-buttons-container');

            if (notion && !isNaN(idx)) {
                const subject = sujetsPhilo[notion][idx];

                btnThesis.textContent = subject.thesis;
                btnAntithesis.textContent = subject.antithesis;

                btnThesis.style.display = 'block';
                btnAntithesis.style.display = 'block';
                if (container) container.style.display = 'flex';

                // Clear active button styles
                btnThesis.classList.remove('active');
                btnAntithesis.classList.remove('active');
            } else {
                btnThesis.style.display = 'none';
                btnAntithesis.style.display = 'none';
                if (container) container.style.display = 'none';
            }
            // Clear current selection since subject changed
            state.activeThesis = null;
            state.thesisOrientation = null;
            updateDisplaySelectedThesis();
            render();
        }

        function selectArgPosition(orientation) {
            saveCurrentDraftToLastRenderedSubject();
            const notion = document.getElementById("select-notion-arg").value;
            const idx = parseInt(document.getElementById("select-sujet-arg").value, 10);
            if (!notion || isNaN(idx)) return;

            const subject = sujetsPhilo[notion][idx];
            state.thesisOrientation = orientation;
            state.activeThesis = orientation === 'thesis' ? subject.thesis : subject.antithesis;

            // Toggle active classes on buttons
            document.getElementById('btn-arg-thesis').classList.toggle('active', orientation === 'thesis');
            document.getElementById('btn-arg-antithesis').classList.toggle('active', orientation === 'antithesis');

            updateDisplaySelectedThesis();
            render();
        }

        function updateCustomArgPosition() {
            saveCurrentDraftToLastRenderedSubject();
            const text = document.getElementById("input-custom-thesis").value.trim();
            if (text) {
                state.activeThesis = text;
                state.thesisOrientation = 'custom';
            } else {
                state.activeThesis = null;
                state.thesisOrientation = null;
            }
            updateDisplaySelectedThesis();
            render();
        }

        function toggleArgumentationMode(isCustom) {
            saveCurrentDraftToLastRenderedSubject();
            state.isCustomArgumentation = isCustom;
            document.getElementById('argumentation-predefined').style.display = isCustom ? 'none' : 'block';
            document.getElementById('argumentation-custom').style.display = isCustom ? 'block' : 'none';

            if (isCustom) {
                // Switch to custom: read from input
                updateCustomArgPosition();
            } else {
                // Switch to predefined list: reset input and update from active button
                document.getElementById('input-custom-thesis').value = '';
                const btnThesis = document.getElementById('btn-arg-thesis');
                const btnAntithesis = document.getElementById('btn-arg-antithesis');

                if (state.thesisOrientation === 'thesis') {
                    btnThesis.classList.add('active');
                    btnAntithesis.classList.remove('active');
                    selectArgPosition('thesis');
                } else if (state.thesisOrientation === 'antithesis') {
                    btnAntithesis.classList.add('active');
                    btnThesis.classList.remove('active');
                    selectArgPosition('antithesis');
                } else {
                    btnThesis.classList.remove('active');
                    btnAntithesis.classList.remove('active');
                    state.activeThesis = null;
                    state.thesisOrientation = null;
                    updateDisplaySelectedThesis();
                }
            }
            render();
        }

        function updateDisplaySelectedThesis() {
            const display = document.getElementById('display-selected-thesis');
            if (!display) return;
            if (state.activeThesis && state.exerciseType === 'dissertation' && state.mode === 'argumentation') {
                display.innerHTML = "<strong>Position à défendre :</strong> " + state.activeThesis;
                display.style.display = 'block';
            } else {
                display.innerHTML = '';
                display.style.display = 'none';
            }
        }

        function initArgumentationSubMode() {
            if (state.exerciseType === 'explication') {
                populateExplicTextArgSelector();
                const select = document.getElementById('select-explic-text-arg');
                if (select) {
                    if (state.activeFragment && state.activeFragment.textIndex !== null) {
                        select.value = state.activeFragment.textIndex.toString();
                    } else if (!select.value && state.explicTexts.length > 0) {
                        select.value = "0";
                    }
                    if (!state.isCustomExplicationArg) {
                        selectExplicTextArg(select.value);
                    }
                } else {
                    if (!state.isCustomExplicationArg) {
                        state.activeThesis = null;
                        state.thesisOrientation = null;
                    }
                }
                toggleExplicationArgMode(state.isCustomExplicationArg);
            } else if (state.exerciseType === 'dissertation') {
                toggleArgumentationMode(state.isCustomArgumentation);
            }

            updateArgumentationMethodology();
            updateDisplaySelectedThesis();
        }

        function populateExplicTextArgSelector() {
            const sel = document.getElementById('select-explic-text-arg');
            if (!sel) return;
            if (sel.children.length <= 1) {
                sel.innerHTML = '<option value="">-- Sélectionnez un texte --</option>' +
                    state.explicTexts.map((t, i) => `<option value="${i}">${t.label}</option>`).join('');
            }
        }

        function selectExplicTextArg(val) {
            saveCurrentDraftToLastRenderedSubject();
            const idx = parseInt(val, 10);
            if (isNaN(idx) || idx < 0 || idx >= state.explicTexts.length) {
                state.activeFragment = null;
                state.activeThesis = null;
                state.thesisOrientation = null;
                render();
                return;
            }

            const textData = state.explicTexts[idx];

            if (!state.activeFragment || state.activeFragment.textIndex !== idx) {
                state.activeFragment = { textIndex: idx, momentIndex: 0, subMomentIndex: 0 };
            }

            if (textData.structure && textData.structure[state.activeFragment.momentIndex]) {
                state.activeThesis = textData.structure[state.activeFragment.momentIndex].subMoments[state.activeFragment.subMomentIndex];
                state.thesisOrientation = 'fragment';
            } else {
                state.activeThesis = null;
                state.thesisOrientation = null;
            }

            state.currentExplicTextIndex = idx;
            state.currentExplicText = textData;

            render();
        }

        function clickFragment(textIdx, mIdx, sIdx) {
            saveCurrentDraftToLastRenderedSubject();
            state.activeFragment = { textIndex: textIdx, momentIndex: mIdx, subMomentIndex: sIdx };
            selectExplicTextArg(textIdx);
        }

        function updateArgumentationMethodology() {
            if (state.exerciseType === 'explication') {
                content.argumentation.trainingTemplate = `    [REFORMULATION]\n    [ARGUMENT]\n    [RÉF/EX]\n    [TRANSITION]`;
                content.argumentation.fields = ["REFORMULATION", "ARGUMENT", "RÉF/EX", "TRANSITION"];
                content.argumentation.methodo = `<h2>Méthodologie de l’explication de fragment</h2>
            <div class="methodo-block"><h3>Reformulation</h3>
            <p>Résumer en quelques phrases ce que l'auteur fait dans ce passage et ce qu'il y dit. Expliquer consiste à déplier et mettre en évidence ce qui demeure implicite. <strong>Attention&nbsp;: L'analyse philosophique ne s'intéresse pas aux figures de style (la forme) mais à la dimension argumentative (le fond).</strong></p>
            </div>
            <div class="methodo-block"><h3>Argument</h3>
            <p>Montrer que l’auteur a raison avec un argument conceptuel abstrait, en intégrant obligatoirement la définition d’au moins un terme important du fragment. Si nécessaire, on peut proposer des hypothèses d'interprétation justifiées (et admettre l'incertitude interprétative si nécessaire). <strong>Postulat de cohérence&nbsp;: L’auteur ne peut pas se contredire, il faut partir du principe qu’il est cohérent tout le long du texte.</strong></p>
            </div>
            <div class="methodo-block"><h3>Référence/Exemple</h3>
            <p>Illustrer le propos de l’auteur avec une référence philosophique ou un exemple extérieur solide (historique, littéraire, scientifique) s'il n'en propose pas. L'exemple doit être universel (pas d'anecdote triviale ou purement personnelle) et le lien avec l'argument doit être explicitement démontré.</p>
            </div>
            <div class="methodo-block"><h3>Transition</h3>
            <p>Faire une phrase de transition (sous forme de question ou en mesurant ce qui fait encore défaut) s’appuyant éventuellement sur une objection rigoureuse pour montrer comment ce passage s’articule avec le fragment ou le moment suivant.</p>
            </div>`;
            } else {
                content.argumentation.trainingTemplate = `    [ARGUMENT]\n    [RÉF/EX]`;
                content.argumentation.fields = ["ARGUMENT", "RÉF/EX"];
                content.argumentation.methodo = `<h2>Méthodologie de l’argumentation</h2>
            <div class="methodo-block"><h3>Argument</h3>
            <p>Rédiger un argument consiste donner une bonne raison d’adhérer à la position défendue. Dans l’idéal, l’argument doit donc apporter une preuve conceptuelle et abstraite qui démontre la vérité de la position défendue. <strong>Attention à ne pas raconter d’histoires ni donner d’exemples concrets.</strong></p>
            
            <p style="margin-top: 15px; font-weight: bold;">Méthode indirecte – Par étapes&nbsp;:</p>
            <ul style="margin-top: 5px;">
                <li><strong>Le recensement initial&nbsp;:</strong> listez au brouillon deux ou trois exemples marquants qui illustrent la thèse défendue.</li>
                <li><strong>Le regroupement par affinité&nbsp;:</strong> rassemblez les exemples similaires afin de former des blocs cohérents d’illustrations.</li>
                <li><strong>La formalisation abstraite&nbsp;:</strong> interrogez-vous&nbsp;: «&nbsp;Pourquoi ce groupe d’exemples permet-il de justifier la thèse&nbsp;?&nbsp;» La réponse théorique à cette question (le «&nbsp;parce que...&nbsp;» global) constituera votre argument général valide dans tous les cas.</li>
            </ul>

            <p style="margin-top: 15px; font-weight: bold;">Méthode directe – Au choix&nbsp;:</p>
            <ul style="margin-top: 5px;">
                <li><strong>L’emboîtement définitionnel&nbsp;:</strong> déduisez la thèse de l’articulation de définitions de concepts clés.</li>
                <li><strong>Le rapport de causalité&nbsp;:</strong> justifiez la thèse par ses causes ou ses conséquences objectives, par sa finalité ou ses raisons.</li>
                <li><strong>L’action réciproque&nbsp;:</strong> montrez comment les concepts de la thèse défendue interagissent ou s’influencent mutuellement.</li>
                <li><strong>Le raisonnement par l’absurde&nbsp;:</strong> démontrez que la position inverse de la vôtre est impossible à soutenir ou contradictoire.</li>
                <li><strong>La diversification des perspectives&nbsp;:</strong> variez les angles d’approche pour viser une complétude analytique. <em>Note&nbsp;: chaque argument ne traite qu’une perspective déterminée à la fois&nbsp;; c’est la combinaison de plusieurs arguments traitant des angles distincts qui permet de construire une démonstration probante et nuancée.</em> S’appuyer sur des repères clés&nbsp;: (ex&nbsp;: <em>soi / les autres / la société</em>, <em>subjectif / objectif</em>, <em>passé / présent / futur</em>, <em>en théorie / en pratique</em>, <em>désir / devoir</em>, <em>abstrait / concret</em>, <em>légal / légitime</em>, <em>croire / savoir</em>, <em>l’intention / les conséquences</em>, <em>nature / culture</em>, <em>pouvoir&nbsp;: droit légal / capacité matérielle / possibilité logique</em>, <em>corps / esprit</em>, <em>conscient / inconscient</em>, <em>raison / passion</em>, <em>volonté / désir</em>, <em>absolu / relatif</em>, <em>contingent / nécessaire</em>, <em>essentiel / accidentel</em>, <em>obligation / contrainte</em>, <em>public / privé</em>, <em>universel / général / particulier / singulier</em>).</li>
            </ul></div>

            <div class="methodo-block"><h3>Référence / Exemple</h3>
            <p>Donnez du relief à votre argument général à l’aide d’une référence philosophique (Auteur, Œuvre) ou d’un exemple particulier qui peut être historique, littéraire, scientifique, etc.</p>
            <ul style="margin-top: 5px;">
                <li><strong>Universalité et légitimité&nbsp;:</strong> l’exemple doit avoir une portée générale, parler à tout le monde et relever si possible d’un champ de la culture usuellement considéré comme légitime. Évitez les anecdotes personnelles ou triviales.</li>
                <li><strong>Explicitation du lien&nbsp;:</strong> ne vous contentez pas de parachuter votre exemple. Expliquez en toutes lettres en quoi ce cas précis confirme la règle générale que vous avez démontrée dans votre argument.</li>
            </ul></div>`;
            }
        }
    </script>
</body>
