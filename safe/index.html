                            if (isStart) {
                                if (inParagraph) {
                                    textHtml += `</p>`;
                                }
                                textHtml += `<p style="margin-bottom: 15px;">`;
                                inParagraph = true;
                            } else {
                                textHtml += " ";
                            }
                            textHtml += sub;
                        });
                    });
                    if (inParagraph) {
                        textHtml += `</p>`;
                    }
                    selectedTextHtml = textHtml;
                    if (state.currentExplicText.source) {
                        selectedTextHtml += `<p style="text-align: right; margin-top: 15px; color: #475569;">${state.currentExplicText.source}</p>`;
                    }
                    if (state.currentExplicText.notes) {
                        selectedTextHtml += `<div style="margin-top: 15px; color: #475569;">${state.currentExplicText.notes}</div>`;
                    }
                } else {
                    selectedTextHtml = state.currentExplicText.html || "";
                }
                selectedTextTitle = state.currentExplicText.label || state.currentExplicText.title;
                sujet = selectedTextTitle || "Explication de texte";
            }

            let trainingText = document.getElementById("training-textarea") ? document.getElementById("training-textarea").value.trim() : '';
            if (!trainingText) {
                alert("Veuillez r├®diger votre texte dÔÇÖentra├«nement avant dÔÇÖenvoyer.");
                return;
            }

            if (trainingText.length < 10) {
                alert("Veuillez r├®diger votre travail avant de demander la correction.");
                return;
            }

            const sujetActif = obtenirSujetActif();
            const currentSubKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
            const storedCorrection = getSubjectStoredDraftAndCorrection(state.exerciseType, state.mode, sujetActif);
            const normStoredSub = storedCorrection.correction && storedCorrection.correction.sujet ? getSubjectStorageKey(state.exerciseType, state.mode, storedCorrection.correction.sujet) : currentSubKey;
            const savedCorrectionObj = (storedCorrection.correction && storedCorrection.correction.html && sujetActif !== '' && normStoredSub === currentSubKey) ? storedCorrection.correction : null;

            // ├ëvaluation souveraine et ├®quitable : chaque copie est ├®valu├®e en soi, de mani├¿re anonyme et absolue.
            // On ne transmet aucun historique de notation au serveur pour garantir qu'├á saisie identique, la note soit identique.

            // Visuel de chargement
            const btnSubmit = document.querySelector(".btn-submit");
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = "ÔÅ│ Analyse en cours<span class='loading-dots'></span>";
                btnSubmit.style.opacity = "0.6";
                btnSubmit.style.cursor = "not-allowed";
            }

            document.getElementById("loading-msg").style.display = "block";
            document.getElementById("correction-box").style.display = "none";

            try {
                // D├®termine les param├¿tres d'envoi pour l'├®valuation unifi├®e
                const body = {
                    sujet,
                    concours: state.concours,
                    epreuve: state.epreuve,
                    type: state.exerciseType,
                    mode: 'redaction',
                    texte: trainingText
                };
                if (state.exerciseType === 'explication') {
                    body.selectedTextTitle = selectedTextTitle;
                    body.selectedTextHtml = selectedTextHtml;
                }

                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept-Encoding": "identity"
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) throw new Error("Le serveur a rencontr├® un probl├¿me.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                document.getElementById("correction-text").innerHTML = "";
                document.getElementById("correction-box").style.display = "block";
                switchCorrectionTab('rapport');
                const badgeInit = document.getElementById("badge-nb-annotations");
                if (badgeInit) badgeInit.style.display = "none";
                const containerInit = document.getElementById("copie-annotee-container");
                if (containerInit) containerInit.innerHTML = "";

                document.getElementById("correction-box").scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

                let texteCumule = "";
                state.streamingTexteCumule = "";
                const currentDraftBySection = extraireTexteParSection(trainingText);
                let lastCopieRefresh = 0;
                let lastAnnotCount = 0;

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        texteCumule += chunk;
                        state.streamingTexteCumule = texteCumule;
                        const intermediateHtml = marked.parse(normaliserMarkdownCorrection(texteCumule));
                        const intermediateTransformed = transformerRenduCorrection(intermediateHtml, savedCorrectionObj, currentDraftBySection);
                        document.getElementById("correction-text").innerHTML = intermediateTransformed.html;
                        updateFloatingQuickNav(intermediateTransformed.sections, intermediateTransformed.globalScore);

                        // Mise ├á jour progressive du badge d'annotations pendant le streaming
                        const streamedAnnotations = extraireAnnotationsChirurgicales(texteCumule);
                        const streamingBadge = document.getElementById("badge-nb-annotations");
                        if (streamingBadge) {
                            if (streamedAnnotations.length > 0) {
                                streamingBadge.innerText = streamedAnnotations.length;
                                streamingBadge.style.display = "inline-flex";
                            } else {
                                streamingBadge.style.display = "none";
                            }
                        }

                        // Si l'utilisateur est sur l'onglet Copie annot├®e pendant le streaming, actualiser la vue de mani├¿re cadenc├®e
                        const paneCopie = document.getElementById("pane-copie-annotee");
                        const now = Date.now();
                        if (paneCopie && paneCopie.style.display === "block" && (streamedAnnotations.length !== lastAnnotCount || now - lastCopieRefresh > 2000)) {
                            lastAnnotCount = streamedAnnotations.length;
                            lastCopieRefresh = now;
                            rafraichirCopieAnnotee(texteCumule, trainingText);
                        }
                    }
                } catch (streamError) {
                    texteCumule += "\n\n[Erreur de connexion : le flux a ├®t├® interrompu par le r├®seau. Veuillez r├®essayer si la correction est incompl├¿te.]";
                    state.streamingTexteCumule = texteCumule;
                    const errHtml = marked.parse(normaliserMarkdownCorrection(texteCumule));
                    const errTransformed = transformerRenduCorrection(errHtml, savedCorrectionObj, currentDraftBySection);
                    const corrTextElErr = document.getElementById("correction-text");
                    if (corrTextElErr) {
                        corrTextElErr.innerHTML = errTransformed.html;
                        appliquerRenduLatex(corrTextElErr);
                    }
                    updateFloatingQuickNav(errTransformed.sections, errTransformed.globalScore);
                } finally {
                    state.streamingTexteCumule = null;
                }

                const correctionHtmlFinale = marked.parse(normaliserMarkdownCorrection(texteCumule));
                const transformedFinal = transformerRenduCorrection(correctionHtmlFinale, savedCorrectionObj, currentDraftBySection);
                const corrTextEl = document.getElementById("correction-text");
                if (corrTextEl) {
                    corrTextEl.innerHTML = transformedFinal.html;
                    appliquerRenduLatex(corrTextEl);
                }
                updateFloatingQuickNav(transformedFinal.sections, transformedFinal.globalScore);

                // Reconstitution finale compl├¿te de la copie annot├®e
                rafraichirCopieAnnotee(texteCumule, trainingText);

                const newCorrectionObj = {
                    sujet: sujetActif,
                    html: transformedFinal.html,
                    atelierHtml: transformedFinal.atelierHtml,
                    atelierCasCount: transformedFinal.casCount,
                    rawMarkdown: texteCumule,
                    scores: transformedFinal.sections,
                    globalScore: transformedFinal.globalScore,
                    draftBySection: currentDraftBySection,
                    draftText: trainingText
                };
                
                const currentSubjectKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
                const prof = getActiveProfile();
                if (!prof.subjectsData[currentSubjectKey]) {
                    prof.subjectsData[currentSubjectKey] = {
                        activeCranId: 'draft',
                        draftParentId: null,
                        workingDraft: '',
                        crans: [],
                        updatedAt: Date.now()
                    };
                }
                const entry = prof.subjectsData[currentSubjectKey];
                if (!Array.isArray(entry.crans)) {
                    entry.crans = [];
                }

                // D├®termination du parent pour l'insertion par filiation (Option 2)
                let parentId = null;
                if (typeof entry.activeCranId === 'number') {
                    parentId = entry.activeCranId;
                } else if (entry.draftParentId) {
                    parentId = entry.draftParentId;
                } else if (entry.crans.length > 0) {
                    parentId = entry.crans[0].id;
                }

                // G├®n├®ration d'un nouvel identifiant s├®quentiel de cran
                const maxId = entry.crans.length > 0 ? Math.max(...entry.crans.map(c => c.id || 0)) : 0;
                const newCranId = maxId + 1;

                const now = new Date();
                const timeLabel = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const score = (typeof transformedFinal.globalScore === 'number') ? transformedFinal.globalScore : null;

                const newCran = {
                    id: newCranId,
                    parentId: parentId,
                    timestamp: Date.now(),
                    timeLabel: timeLabel,
                    score: score,
                    draft: trainingText,
                    correction: newCorrectionObj
                };

                entry.crans = insertCranAboveParent(entry.crans, newCran, parentId);
                entry.activeCranId = newCranId;
                entry.draftParentId = newCranId;
                entry.workingDraft = trainingText;
                entry.hideDraftCorrection = false;
                entry.updatedAt = Date.now();

                updateLastActiveState();
                persistStorageData();
                updateFloatingProfileDock();
                const btnSecondary = document.querySelector(".btn-secondary");
                if (btnSecondary) {
                    btnSecondary.innerText = "Effacer la correction";
                }
            } catch (error) {
                alert("Erreur lors de la communication avec le correcteur : " + error.message);
            } finally {
                document.getElementById("loading-msg").style.display = "none";
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Correction IA";
                    btnSubmit.style.opacity = "1";
                    btnSubmit.style.cursor = "pointer";
                }
            }
        }

        function updateSujetsArg() {
            saveCurrentDraftToLastRenderedSubject();
            const notion = document.getElementById("select-notion-arg").value;
            const selectSujet = document.getElementById("select-sujet-arg");
            selectSujet.innerHTML = '<option value="">-- S├®lectionnez un sujet --</option>';

            // Hide buttons and clear selection state since the notion changed
            document.getElementById('btn-arg-thesis').style.display = 'none';
            document.getElementById('btn-arg-antithesis').style.display = 'none';
            const container = document.getElementById('arg-buttons-container');
            if (container) container.style.display = 'none';
            state.activeThesis = null;
            state.thesisOrientation = null;
            updateDisplaySelectedThesis();

            if (notion) {
                selectSujet.disabled = false;
                selectSujet.innerHTML = '<option value="">-- S├®lectionnez un sujet dÔÇÖ├®tude --</option>';
                sujetsPhilo[notion].forEach((s, idx) => {
                    const opt = document.createElement("option");
                    opt.value = idx;
                    opt.textContent = s.question;
                    selectSujet.appendChild(opt);
                });
            } else {
                selectSujet.disabled = true;
            }
            render();
        }

        function updateArgThesisButtons() {
            saveCurrentDraftToLastRenderedSubject();
            const notion = document.getElementById("select-notion-arg").value;
            const idx = parseInt(document.getElementById("select-sujet-arg").value, 10);

            const btnThesis = document.getElementById('btn-arg-thesis');
            const btnAntithesis = document.getElementById('btn-arg-antithesis');
            const container = document.getElementById('arg-buttons-container');

            if (notion && !isNaN(idx)) {
                const subject = sujetsPhilo[notion][idx];

                btnThesis.textContent = subject.thesis;
                btnAntithesis.textContent = subject.antithesis;

                btnThesis.style.display = 'block';
                btnAntithesis.style.display = 'block';
                if (container) container.style.display = 'flex';

                // Clear active button styles
                btnThesis.classList.remove('active');
                btnAntithesis.classList.remove('active');
            } else {
                btnThesis.style.display = 'none';
                btnAntithesis.style.display = 'none';
                if (container) container.style.display = 'none';
            }
            // Clear current selection since subject changed
            state.activeThesis = null;
            state.thesisOrientation = null;
            updateDisplaySelectedThesis();
            render();
        }

        function selectArgPosition(orientation) {
            saveCurrentDraftToLastRenderedSubject();
            const notion = document.getElementById("select-notion-arg").value;
            const idx = parseInt(document.getElementById("select-sujet-arg").value, 10);
            if (!notion || isNaN(idx)) return;

            const subject = sujetsPhilo[notion][idx];
            state.thesisOrientation = orientation;
            state.activeThesis = orientation === 'thesis' ? subject.thesis : subject.antithesis;

            // Toggle active classes on buttons
            document.getElementById('btn-arg-thesis').classList.toggle('active', orientation === 'thesis');
            document.getElementById('btn-arg-antithesis').classList.toggle('active', orientation === 'antithesis');

            updateDisplaySelectedThesis();
            render();
        }

        function updateCustomArgPosition() {
            saveCurrentDraftToLastRenderedSubject();
            const text = document.getElementById("input-custom-thesis").value.trim();
            if (text) {
                state.activeThesis = text;
                state.thesisOrientation = 'custom';
            } else {
                state.activeThesis = null;
                state.thesisOrientation = null;
            }
            updateDisplaySelectedThesis();
            render();
        }

        function toggleArgumentationMode(isCustom) {
            saveCurrentDraftToLastRenderedSubject();
            state.isCustomArgumentation = isCustom;
            document.getElementById('argumentation-predefined').style.display = isCustom ? 'none' : 'block';
            document.getElementById('argumentation-custom').style.display = isCustom ? 'block' : 'none';

            if (isCustom) {
                // Switch to custom: read from input
                updateCustomArgPosition();
            } else {
                // Switch to predefined list: reset input and update from active button
                document.getElementById('input-custom-thesis').value = '';
                const btnThesis = document.getElementById('btn-arg-thesis');
                const btnAntithesis = document.getElementById('btn-arg-antithesis');

                if (state.thesisOrientation === 'thesis') {
                    btnThesis.classList.add('active');
                    btnAntithesis.classList.remove('active');
                    selectArgPosition('thesis');
                } else if (state.thesisOrientation === 'antithesis') {
                    btnAntithesis.classList.add('active');
                    btnThesis.classList.remove('active');
                    selectArgPosition('antithesis');
                } else {
                    btnThesis.classList.remove('active');
                    btnAntithesis.classList.remove('active');
                    state.activeThesis = null;
                    state.thesisOrientation = null;
                    updateDisplaySelectedThesis();
                }
            }
            render();
        }

        function updateDisplaySelectedThesis() {
            const display = document.getElementById('display-selected-thesis');
            if (!display) return;
            if (state.activeThesis && state.exerciseType === 'dissertation' && state.mode === 'argumentation') {
                display.innerHTML = "<strong>Position ├á d├®fendre :</strong> " + state.activeThesis;
                display.style.display = 'block';
            } else {
                display.innerHTML = '';
                display.style.display = 'none';
            }
        }

        function initArgumentationSubMode() {
            if (state.exerciseType === 'explication') {
                populateExplicTextArgSelector();
                const select = document.getElementById('select-explic-text-arg');
                if (select) {
                    if (state.activeFragment && state.activeFragment.textIndex !== null) {
                        select.value = state.activeFragment.textIndex.toString();
                    } else if (!select.value && state.explicTexts.length > 0) {
                        select.value = "0";
                    }
                    if (!state.isCustomExplicationArg) {
                        selectExplicTextArg(select.value);
                    }
                } else {
                    if (!state.isCustomExplicationArg) {
                        state.activeThesis = null;
                        state.thesisOrientation = null;
                    }
                }
                toggleExplicationArgMode(state.isCustomExplicationArg);
            } else if (state.exerciseType === 'dissertation') {
                toggleArgumentationMode(state.isCustomArgumentation);
            }

            updateArgumentationMethodology();
            updateDisplaySelectedThesis();
        }

        function populateExplicTextArgSelector() {
            const sel = document.getElementById('select-explic-text-arg');
            if (!sel) return;
            if (sel.children.length <= 1) {
                sel.innerHTML = '<option value="">-- S├®lectionnez un texte --</option>' +
                    state.explicTexts.map((t, i) => `<option value="${i}">${t.label}</option>`).join('');
            }
        }

        function selectExplicTextArg(val) {
            saveCurrentDraftToLastRenderedSubject();
            const idx = parseInt(val, 10);
            if (isNaN(idx) || idx < 0 || idx >= state.explicTexts.length) {
                state.activeFragment = null;
                state.activeThesis = null;
                state.thesisOrientation = null;
                render();
                return;
            }

            const textData = state.explicTexts[idx];

            if (!state.activeFragment || state.activeFragment.textIndex !== idx) {
                state.activeFragment = { textIndex: idx, momentIndex: 0, subMomentIndex: 0 };
            }

            if (textData.structure && textData.structure[state.activeFragment.momentIndex]) {
                state.activeThesis = textData.structure[state.activeFragment.momentIndex].subMoments[state.activeFragment.subMomentIndex];
                state.thesisOrientation = 'fragment';
            } else {
                state.activeThesis = null;
                state.thesisOrientation = null;
            }

            state.currentExplicTextIndex = idx;
            state.currentExplicText = textData;

            render();
        }

        function clickFragment(textIdx, mIdx, sIdx) {
            saveCurrentDraftToLastRenderedSubject();
            state.activeFragment = { textIndex: textIdx, momentIndex: mIdx, subMomentIndex: sIdx };
            selectExplicTextArg(textIdx);
        }

        function updateArgumentationMethodology() {
            if (state.exerciseType === 'explication') {
                content.argumentation.trainingTemplate = "";
                content.argumentation.fields = [];
                content.argumentation.methodo = getMethodoContent(state.concours, state.epreuve, 'argumentation');
            } else {
                content.argumentation.trainingTemplate = "";
                content.argumentation.fields = [];
                content.argumentation.methodo = getMethodoContent(state.concours, state.epreuve, 'argumentation');
            }
        }
    </script>
