        function segmenterEnUnitesDeSens(text) {
            if (!text || typeof text !== 'string') return [];
            // Regex d'abr├®viations acad├®miques et initiales d'auteurs (ex. : M. Foucault, cf., op. cit.)
            const abbrevRegex = /\b(?:M|Mme|Mlle|cf|├®d|ed|op\.?\s*cit|ibid|sq|al|ex|chap|vol|art|p|pp|t|ca|i\.?e|e\.?g|etc|[A-Z├Ç-├û├ÿ-├ƒ])\.$/i;
            const units = [];
            let start = 0;
            let inGuillemets = false;
            let inParenthesis = 0;
            let inBrackets = 0;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '┬½') inGuillemets = true;
                else if (char === '┬╗') inGuillemets = false;
                else if (char === '(') inParenthesis++;
                else if (char === ')') inParenthesis = Math.max(0, inParenthesis - 1);
                else if (char === '[') inBrackets++;
                else if (char === ']') inBrackets = Math.max(0, inBrackets - 1);

                // Ne d├®couper que hors guillemets, parenth├¿ses ou crochets
                if (!inGuillemets && inParenthesis === 0 && inBrackets === 0 && (char === '.' || char === '?' || char === '!' || char === 'ÔÇª')) {
                    let endPos = i + 1;
                    while (endPos < text.length && (text[endPos] === '┬╗' || text[endPos] === ')' || text[endPos] === ']' || text[endPos] === '"' || text[endPos] === 'ÔÇÖ' || text[endPos] === '\'')) {
                        endPos++;
                    }

                    if (endPos === text.length || /\s/.test(text[endPos])) {
                        const candidate = text.substring(start, endPos).trim();
                        const wordMatch = candidate.match(/\b[A-Za-z├Ç-├û├ÿ-├Â├©-├┐\.-]+\.$/);
                        if (wordMatch && abbrevRegex.test(wordMatch[0]) && endPos < text.length) {
                            continue;
                        }
                        // Chiffres de liste ou ordinaux (ex. : 1., 2.)
                        if (/\b\d+\.$/.test(candidate) && endPos < text.length) {
                            continue;
                        }

                        // V├®rifier si la suite imm├®diate commence par une minuscule (continuation de la m├¬me phrase)
                        const afterSlice = text.substring(endPos).trim();
                        if (afterSlice.length > 0 && /^[a-z├á-├Â├©-├┐]/.test(afterSlice) && !afterSlice.startsWith('et ') && !afterSlice.startsWith('mais ')) {
                            continue;
                        }

                        // Unit├® de sens philosophique : agr├®ger les propositions trop courtes (< 75 caract├¿res) avec la phrase suivante
                        // pour d├®limiter une v├®ritable unit├® d'analyse ou de raisonnement philosophique
                        if (candidate.length < 75 && endPos < text.length) {
                            continue;
                        }

                        if (candidate.length > 0) {
                            units.push({ start, end: endPos, text: candidate });
                            while (endPos < text.length && /\s/.test(text[endPos])) {
                                endPos++;
                            }
                            start = endPos;
                            i = endPos - 1;
                        }
                    }
                }
            }
            if (start < text.length) {
                const rest = text.substring(start).trim();
                if (rest.length > 0) {
                    if (rest.length < 40 && units.length > 0) {
                        const last = units[units.length - 1];
                        last.end = text.length;
                        last.text = text.substring(last.start, text.length).trim();
                    } else {
                        units.push({ start, end: text.length, text: rest });
                    }
                }
            }
            return units;
        }

        async function declencherMicroAnnotation(spanEl) {
            if (!spanEl || spanEl.classList.contains('loading-micro')) return;
            const encPhrase = spanEl.getAttribute('data-phrase');
            const phrase = encPhrase ? decodeURIComponent(encPhrase) : spanEl.textContent.trim();
            if (!phrase || phrase.length < 4) return;

            const parentP = spanEl.closest('p');
            const contexte = parentP ? parentP.textContent.trim() : '';

            spanEl.classList.add('loading-micro');
            spanEl.setAttribute('title', 'ÔÅ│ Analyse chirurgicale en cours par le jury...');

            const sujetActif = obtenirSujetActif();
            const targetConcours = state.concours || 'Capes Externe';
            const targetEpreuve = state.epreuve || (state.exerciseType === 'explication' ? 'Explication de texte' : 'Dissertation');

            try {
                const body = {
                    action: 'micro_annotation',
                    phrase: phrase,
                    contexte: contexte,
                    sujet: sujetActif,
                    concours: targetConcours,
                    epreuve: targetEpreuve,
                    type: state.exerciseType
                };

                if (state.exerciseType === 'explication' && state.currentExplicText) {
                    body.selectedTextTitle = state.currentExplicText.label || state.currentExplicText.title;
                    body.selectedTextHtml = state.currentExplicText.html || '';
                }

                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!response.ok) throw new Error('Le serveur a retourn├® une erreur ' + response.status);

                const data = await response.json();
                if (data && data.success && data.markdown) {
                    // Nettoyage et normalisation de l'extrait exact pour garantir qu'il correspond mot ├á mot ├á la proposition s├®lectionn├®e
                    let cleanMicroMd = data.markdown.trim();
                    cleanMicroMd = cleanMicroMd.replace(/^```(?:markdown)?\r?\n/i, '').replace(/\r?\n```$/i, '').trim();

                    const extraitRegex = /(?:^|\n)[ \t]*(?:[-*ÔÇó]|\d+\.)?[ \t]*(?:\*\*)?Extrait(?:\s+exact)?(?:\s*:\s*\*\*|\*\*\s*:[ \t]*|[ \t]*:[ \t]*)[\s\S]*?(?=(?:^|\n)[ \t]*(?:[-*ÔÇó]|\d+\.)?[ \t]*(?:\*\*)?(?:Typologie|Observation|Diagnostic|Conseil|Piste|Recommandation|R[├¿e]gle|Code|Usage|[├ëEe]clairage|Extrait\s+du\s+jury|Rapport|Citation)|\n##|\n---|$)/i;
                    if (extraitRegex.test(cleanMicroMd)) {
                        cleanMicroMd = cleanMicroMd.replace(extraitRegex, `\n- **Extrait exact** : ┬½ ${phrase.trim()} ┬╗\n`);
                    } else {
                        cleanMicroMd = `- **Extrait exact** : ┬½ ${phrase.trim()} ┬╗\n` + cleanMicroMd;
                    }

                    // V├®rification que l'analyse est compl├¿te et comporte un diagnostic ou un conseil
                    const candidateAnns = extraireAnnotationsChirurgicales(cleanMicroMd);
                    if (candidateAnns.length === 0) {
                        throw new Error("L'analyse retourn├®e par le jury est incompl├¿te. Veuillez relancer la remarque sur cette unit├® de sens.");
                    }

                    // R├®cup├®ration robuste via getSubjectStoredDraftAndCorrection pour g├®rer les crans actifs
                    const stored = getSubjectStoredDraftAndCorrection(state.exerciseType, state.mode, sujetActif);
                    let currentRawMd = (stored.correction && stored.correction.rawMarkdown) ? stored.correction.rawMarkdown : '';
                    let draftText = stored.draft || '';
                    if (!draftText) {
                        const txtArea = document.getElementById('training-textarea');
                        if (txtArea) draftText = txtArea.value;
                    }

                    const updatedMd = currentRawMd.trim() + '\n\n' + cleanMicroMd + '\n';

                    // Persister dans le bon emplacement (correction du cran actif ou entr├®e directe)
                    const prof = getActiveProfile();
                    const subKey = getSubjectStorageKey(state.exerciseType, state.mode, sujetActif);
                    const storedEntry = prof.subjectsData[subKey];
                    if (storedEntry) {
                        const crans = Array.isArray(storedEntry.crans) ? storedEntry.crans : [];
                        const activeCranId = storedEntry.activeCranId;
                        const activeCran = (typeof activeCranId === 'number') ? crans.find(c => c.id === activeCranId) : null;
                        if (activeCran && activeCran.correction) {
                            activeCran.correction.rawMarkdown = updatedMd;
                        } else if (storedEntry.correction) {
                            storedEntry.correction.rawMarkdown = updatedMd;
                        }
                    }
                    persistStorageData();

                    rafraichirCopieAnnotee(updatedMd, draftText);

                    setTimeout(() => {
                        // Trouver et afficher la carte d'annotation correspondant pr├®cis├®ment ├á la proposition analys├®e
                        const phraseClean = phrase.trim();
                        let targetCard = null;
                        let targetMark = null;

                        // 1. Recherche par attribut data-extrait
                        document.querySelectorAll('.inline-annotation-card').forEach(card => {
                            const ext = card.getAttribute('data-extrait') || '';
                            if (ext && (ext === phraseClean || ext.includes(phraseClean.substring(0, 35)) || phraseClean.includes(ext.substring(0, 35)))) {
                                targetCard = card;
                            }
                        });

                        // 2. Recherche de la marque surlign├®e correspondante
                        if (targetCard) {
                            const annId = targetCard.getAttribute('data-annotation-id');
                            if (annId) {
                                targetMark = document.getElementById('mark-ann-' + annId);
                            }
                        } else {
                            // Repli sur la derni├¿re carte de remarque cr├®├®e
                            const allCards = document.querySelectorAll('.inline-annotation-card:not(.type-atelier)');
                            if (allCards.length > 0) {
                                targetCard = allCards[allCards.length - 1];
                                const annId = targetCard.getAttribute('data-annotation-id');
                                if (annId) {
                                    targetMark = document.getElementById('mark-ann-' + annId);
                                }
                            }
                        }

                        if (targetCard) {
                            targetCard.style.display = 'block';
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                        if (targetMark) {
                            targetMark.classList.add('pulse-highlight-new');
                            setTimeout(() => targetMark.classList.remove('pulse-highlight-new'), 2500);
                        }
                    }, 150);
                } else {
                    throw new Error(data.error || 'R├®ponse invalide du serveur');
                }
            } catch (err) {
                console.error('Erreur micro-annotation:', err);
                spanEl.classList.remove('loading-micro');
                spanEl.setAttribute('title', 'Erreur lors de l\'analyse. Cliquez pour r├®essayer.');
                alert('La micro-analyse n\'a pas pu aboutir : ' + (err.message || 'veuillez r├®essayer.'));
            }
        }

        // Extrait les cas cliniques et r├®├®critures d'excellence de l'Atelier
        function extraireCasAtelier(rawMarkdown) {
            if (!rawMarkdown || typeof rawMarkdown !== 'string') return [];
            const cases = [];
            // Recherche de la section Atelier de r├®├®criture
            const atelierMatch = rawMarkdown.match(/##\s*(?:4\.?\s*)?(?:­ƒÄ»\s*)?(?:Atelier\s+de\s+r[├®e][├®e]criture|PISTES\s+CONCR[├êE]TES)[^\n]*\n([\s\S]*?)(?=\n##\s*\d|\n##\s*[^#]|$)/i);
            const atelierText = atelierMatch ? atelierMatch[1] : rawMarkdown;

            const patternCas = /(?:^|\n)###\s*(?:Cas\s*(?:n[┬░o]\s*)?(\d+)|Mod[├®e]lisation[^\n]*)\s*[:\-ÔÇôÔÇö]?\s*([^\n]*)([\s\S]*?)(?=(?:\n###\s*(?:Cas|Mod[├®e]lisation|Questions))|$)/gi;
            let m;
            let fallbackId = 0;
            while ((m = patternCas.exec(atelierText)) !== null) {
                fallbackId++;
                const id = m[1] ? parseInt(m[1], 10) : fallbackId;
                const titre = (m[2] || '').trim();
                const block = m[3] || '';

                let cleanInit = '';
                let cleanVerrou = '';
                let cleanRem = '';
                let cleanGain = '';

                const lines = block.split('\n');
                let currentField = null;

                for (let line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    const isInit = /^[*\-\s]*(?:\*\*)?(?:Passage|Texte|Extrait)[^*:]*(?:\*\*)?\s*[:*]+\s*(.*)$/i.exec(trimmed);
                    const isVerrou = /^[*\-\s]*(?:\*\*)?(?:L['ÔÇÖ]impens[├®e]|Verrou|Diagnostic)[^*:]*(?:\*\*)?\s*[:*]+\s*(.*)$/i.exec(trimmed);
                    const isRem = /^[*\-\s]*(?:\*\*)?(?:Version\s+remani[├®e]e|R[├®e][├®e]criture|Mod[├®e]lisation)[^*:]*(?:\*\*)?\s*[:*]+\s*(.*)$/i.exec(trimmed);
                    const isGain = /^[*\-\s]*(?:\*\*)?(?:B[├®e]n[├®e]fice|Gain|Valeur\s+concours|Ce\s+qui\s+fait)[^*:]*(?:\*\*)?\s*[:*]+\s*(.*)$/i.exec(trimmed);

                    if (isInit) {
                        currentField = 'init';
                        cleanInit = isInit[1].trim();
                    } else if (isVerrou) {
                        currentField = 'verrou';
                        cleanVerrou = isVerrou[1].trim();
                    } else if (isRem) {
                        currentField = 'rem';
                        cleanRem = isRem[1].trim();
                    } else if (isGain) {
                        currentField = 'gain';
                        cleanGain = isGain[1].trim();
                    } else if (currentField) {
                        if (currentField === 'init') cleanInit += ' ' + trimmed;
                        else if (currentField === 'verrou') cleanVerrou += ' ' + trimmed;
                        else if (currentField === 'rem') cleanRem += ' ' + trimmed;
                        else if (currentField === 'gain') cleanGain += ' ' + trimmed;
                    }
                }

                cleanInit = cleanInit.replace(/^[┬½"ÔÇ£']\s*/, '').replace(/\s*[┬╗"ÔÇØ']$/, '').trim();
                cleanRem = cleanRem.replace(/^[┬½"ÔÇ£']\s*/, '').replace(/\s*[┬╗"ÔÇØ']$/, '').trim();

                if (cleanInit || cleanRem) {
                    cases.push({
                        id: id,
                        titre: titre,
                        passageInitial: cleanInit,
                        verrou: cleanVerrou,
                        remaniee: cleanRem,
                        gain: cleanGain
                    });
                }
            }
            return cases;
        }

        function rafraichirCopieAnnotee(rawMarkdown, draftText) {
            const container = document.getElementById('copie-annotee-container');
            const badge = document.getElementById('badge-nb-annotations');
            if (!container) return;

            const annotations = extraireAnnotationsChirurgicales(rawMarkdown);
            const atelierCases = extraireCasAtelier(rawMarkdown);

            if (badge) {
                const totalNotes = annotations.length + atelierCases.length;
                if (totalNotes > 0) {
                    badge.innerText = totalNotes;
                    badge.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                }
            }

            if (!draftText || !draftText.trim()) {
                container.innerHTML = `
                    <div style="padding: 30px; text-align: center; color: #64748b; font-style: italic;">
                        Veuillez r├®diger ou coller votre travail dans la zone de r├®daction pour afficher la copie annot├®e.
                    </div>
                `;
                return;
            }

            if (annotations.length === 0 && atelierCases.length === 0) {
                container.innerHTML = `
                    <div style="padding: 30px; text-align: center; color: #64748b; font-style: italic;">
                        Aucune annotation textuelle chirurgicale d├®tect├®e dans cette ├®valuation.
                    </div>
                `;
                return;
            }

            // Recherche de chaque extrait dans le texte du candidat
            const intervals = [];
            annotations.forEach(ann => {
                const loc = findTextOccurrences(draftText, ann.extrait);
                if (loc) {
                    intervals.push({
                        start: loc.start,
                        end: loc.end,
                        ann: ann,
                        isAtelier: false
                    });
                }
            });

            // Ajout des passages initiaux de l'Atelier de r├®├®criture
            atelierCases.forEach(cas => {
                if (cas.passageInitial) {
                    const loc = findTextOccurrences(draftText, cas.passageInitial);
                    if (loc) {
                        intervals.push({
                            start: loc.start,
                            end: loc.end,
                            cas: cas,
                            ann: { id: 'a' + cas.id, extrait: cas.passageInitial, typologie: 'atelier' },
                            isAtelier: true
                        });
                    }
                }
            });

            intervals.sort((a, b) => a.start - b.start);

            // Filtrage des chevauchements ├®ventuels (priorit├® aux annotations sur les cas d'atelier)
            const cleanIntervals = [];
            let maxEnd = -1;
            // Passe 1 : annotations normales
            const annotationIntervals = intervals.filter(it => !it.isAtelier);
            annotationIntervals.forEach(it => {
                if (it.start >= maxEnd) {
                    cleanIntervals.push(it);
                    maxEnd = it.end;
                }
            });
            // Passe 2 : passages d'atelier (seulement si non chevauch├®s par une annotation)
            const usedRanges = cleanIntervals.map(it => ({ s: it.start, e: it.end }));
            intervals.filter(it => it.isAtelier).forEach(it => {
                const overlaps = usedRanges.some(r => it.start < r.e && it.end > r.s);
                if (!overlaps) {
                    cleanIntervals.push(it);
                    usedRanges.push({ s: it.start, e: it.end });
                }
            });
            cleanIntervals.sort((a, b) => a.start - b.start);

            // Comptage par typologie pour la barre de filtres
            const counts = { all: annotations.length + atelierCases.length, conceptuel: 0, logique: 0, reference: 0, style: 0, etincelle: 0, atelier: atelierCases.length };
            annotations.forEach(ann => {
                const info = getTypologieInfo(ann.typologie);
                if (info.key && counts[info.key] !== undefined) {
                    counts[info.key]++;
                }
            });

            // D├®coupage en segments ordonn├®s (texte brut, surlignage, carte inline)
            const segList = [];
            let cursor = 0;
            cleanIntervals.forEach(it => {
                if (it.start > cursor) {
                    segList.push({ type: 'text', content: draftText.substring(cursor, it.start) });
                }
                if (it.isAtelier) {
                    segList.push({ type: 'highlight', content: draftText.substring(it.start, it.end), cas: it.cas, isAtelier: true });
                    segList.push({ type: 'atelier_card', cas: it.cas });
                } else {
                    segList.push({ type: 'highlight', content: draftText.substring(it.start, it.end), ann: it.ann, isAtelier: false });
                    segList.push({ type: 'card', ann: it.ann });
                }
                cursor = it.end;
            });
            if (cursor < draftText.length) {
                segList.push({ type: 'text', content: draftText.substring(cursor) });
            }

            // Assemblage des blocs HTML (sans imbriquer de div dans un p)
            const blocks = [];
            let curP = [];
            let isContinuation = false;

            function formatProse(str) {
                if (!str) return '';
                return escapeHtml(str).replace(/\r?\n\s*/g, ' ');
            }

            function formatAfterColon(str) {
                if (!str || typeof str !== 'string') return '';
                const trimmed = str.trim();
                if (!trimmed) return '';
                const properNouns = ['Platon', 'Aristote', 'Descartes', 'Spinoza', 'Kant', 'Hegel', 'Nietzsche', 'Heidegger', 'Rousseau', 'Hobbes', 'Locke', 'Hume', 'Leibniz', 'Marx', 'Freud', 'Sartre', 'Foucault'];
                const firstWord = trimmed.split(/\s+/)[0].replace(/[.,;:!?]/g, '');
                if (properNouns.includes(firstWord)) {
                    return trimmed;
                }
                if (/^[A-Z├Ç-├û├ÿ-├ƒ][a-z├á-├Â├©-├┐]/.test(trimmed)) {
                    return trimmed.charAt(0).toLowerCase() + trimmed.slice(1);
                }
                return trimmed;
            }

            segList.forEach(item => {
                if (item.type === 'text') {
                    const rawParts = item.content.split(/\n\s*\n+/);
                    rawParts.forEach((part, pIdx) => {
                        if (pIdx > 0) {
                            const pText = curP.join('').trim();
                            if (pText) blocks.push(`<p class="${isContinuation ? 'copie-p-continuation' : ''}">${pText}</p>`);
                            curP = [];
                            isContinuation = false;
                        }
                        const cleanPart = part.trim();
                        if (cleanPart) {
                            const units = segmenterEnUnitesDeSens(cleanPart);
                            if (units.length > 0) {
                                units.forEach(u => {
                                    const cleanText = formatProse(u.text);
                                    if (cleanText) {
                                        if (u.text.trim().length >= 4) {
                                            const encPhrase = encodeURIComponent(u.text.trim());
                                            curP.push(`<span class="unite-sens-unannotated" data-phrase="${encPhrase}" onclick="declencherMicroAnnotation(this)" title="­ƒöì Cliquer pour obtenir l'analyse de concours de cette proposition">${cleanText}</span> `);
                                        } else {
                                            curP.push(cleanText + ' ');
                                        }
                                    }
                                });
                            } else {
                                const cleanEscaped = formatProse(cleanPart);
                                if (cleanEscaped) curP.push(cleanEscaped + ' ');
                            }
                        }
                    });
                } else if (item.type === 'highlight') {
                    const cleanEscaped = formatProse(item.content);
                    if (item.isAtelier) {
                        curP.push(`<mark class="copie-highlight highlight-atelier" id="mark-atelier-${item.cas.id}" data-typology-key="atelier" onclick="toggleAtelierInlineCard(${item.cas.id})" title="Atelier de r├®├®criture ÔÇö Cas n┬░ ${item.cas.id} : cliquez pour afficher la mod├®lisation r├®dig├®e d'excellence">${cleanEscaped}<span class="inline-atelier-tag">R├®├®criture d'excellence</span></mark>`);
                    } else {
                        const info = getTypologieInfo(item.ann.typologie);
                        curP.push(`<mark class="copie-highlight ${info.cls}" id="mark-ann-${item.ann.id}" data-annotation-id="${item.ann.id}" data-extrait="${escapeHtml(item.ann.extrait)}" data-typology-key="${info.key}" onclick="toggleInlineNote(${item.ann.id})" title="[#${item.ann.id}] ${escapeHtml(info.label)} : cliquez pour afficher ou masquer la remarque">${cleanEscaped}<span class="ann-badge-pill">${item.ann.id}</span></mark>`);
                    }
                } else if (item.type === 'card') {
                    const pText = curP.join('').trim();
                    if (pText) blocks.push(`<p class="${isContinuation ? 'copie-p-continuation' : ''}">${pText}</p>`);
                    curP = [];
                    isContinuation = true;

                    const ann = item.ann;
                    const info = getTypologieInfo(ann.typologie);
                    const diagText = ann.observation ? formatAfterColon(ann.observation) : '';
                    const conseilText = ann.conseil ? formatAfterColon(ann.conseil) : '';
                    const regleText = ann.regle ? formatAfterColon(ann.regle) : '';
                    const eclairageText = ann.eclairage ? formatAfterColon(ann.eclairage) : '';

                    blocks.push(`
                        <div class="inline-annotation-card ${info.cardCls}" id="inline-card-${ann.id}" data-annotation-id="${ann.id}" data-extrait="${escapeHtml(ann.extrait)}" data-typology-key="${info.key}" style="display:none;">
                            <div class="inline-ann-header" onclick="toggleInlineNote(${ann.id})">
                                <div class="inline-ann-title">
                                    <span class="inline-ann-badge">${info.icon} ${escapeHtml(info.label)}</span>
                                    <span class="inline-ann-num">Remarque n┬░ ${ann.id}</span>
                                </div>
                                <div class="inline-ann-action">
                                    <button type="button" class="btn-replier-card" onclick="event.stopPropagation(); toggleInlineNote(${ann.id})">Replier Ô£ò</button>
                                </div>
                            </div>
                            <div class="inline-ann-body" id="inline-body-${ann.id}">
                                <div class="inline-ann-extrait" style="font-size: 13px; color: #475569; font-style: italic; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed #e2e8f0;">
                                    ┬½ ${escapeHtml(ann.extrait)} ┬╗
                                </div>
                                ${diagText ? `<div class="inline-ann-diag"><strong>Diagnostic :</strong> ${(typeof marked !== 'undefined' && marked.parseInline) ? marked.parseInline(diagText) : escapeHtml(diagText)}</div>` : ''}
                                ${conseilText ? `<div class="inline-ann-conseil"><strong>Conseil du jury :</strong> ${(typeof marked !== 'undefined' && marked.parseInline) ? marked.parseInline(conseilText) : escapeHtml(conseilText)}</div>` : ''}
                                ${regleText ? `<div class="inline-ann-regle"><strong>­ƒñ½ R├¿gle implicite :</strong> ${(typeof marked !== 'undefined' && marked.parseInline) ? marked.parseInline(regleText) : escapeHtml(regleText)}</div>` : ''}
                                ${eclairageText ? `<div class="inline-ann-eclairage"><strong>­ƒô£ ├ëclairage du jury :</strong> ┬½ ${(typeof marked !== 'undefined' && marked.parseInline) ? marked.parseInline(eclairageText.replace(/^[┬½\"\"']\s*/, '').replace(/\s*[┬╗\"\"']$/, '')) : escapeHtml(eclairageText.replace(/^[┬½\"\"']\s*/, '').replace(/\s*[┬╗\"\"']$/, ''))} ┬╗</div>` : ''}
                            </div>
                        </div>
                    `);
                } else if (item.type === 'atelier_card') {
                    const pText = curP.join('').trim();
                    if (pText) blocks.push(`<p class="${isContinuation ? 'copie-p-continuation' : ''}">${pText}</p>`);
                    curP = [];
                    isContinuation = true;

                    const cas = item.cas;
                    blocks.push(`
                        <div class="inline-annotation-card type-atelier" id="inline-atelier-card-${cas.id}" data-typology-key="atelier" style="display:none;">
                            <div class="inline-ann-header" onclick="toggleAtelierInlineCard(${cas.id})">
                                <div class="inline-ann-title">
                                    <span class="inline-ann-badge">Ô£¿ R├®├®criture d'excellence</span>
                                    <span class="inline-ann-num">Cas n┬░ ${cas.id}${cas.titre ? ' : ' + escapeHtml(cas.titre) : ''}</span>
                                </div>
                                <div class="inline-ann-action">
                                    <button type="button" class="btn-replier-card" onclick="event.stopPropagation(); toggleAtelierInlineCard(${cas.id})">Replier Ô£ò</button>
                                </div>
                            </div>
                            <div class="inline-ann-body" id="inline-atelier-body-${cas.id}">

        // Extraction intelligente du num├®ro de section (chiffre arabe, chiffre romain ou ordinal)
        function extractSectionNumber(str, prefixKeyword) {
            if (!str || typeof str !== 'string') return null;
            const s = str.toUpperCase().trim();
            const romanMap = { 'I': 1, 'II': 2, 'III': 3, 'IV': 4, 'V': 5, 'VI': 6, 'VII': 7, 'VIII': 8, 'IX': 9, 'X': 10 };

            if (prefixKeyword) {
                const kw = prefixKeyword.toUpperCase();
                // 1. Chiffre arabe direct li├® au mot-cl├® (ex: MOMENT 2, PHASE 1, MOMENT #2, MOMENT : 2)
                const regexDigit = new RegExp('\\b' + kw + '\\s*(?:#|N┬░|NO|:)?\\s*(\\d+)\\b', 'i');
                const mDigit = s.match(regexDigit);
                if (mDigit) return parseInt(mDigit[1], 10);

                // 2. Chiffre romain direct li├® au mot-cl├® (ex: MOMENT II, PHASE IV, MOMENT : III)
                const regexRoman = new RegExp('\\b' + kw + '\\s*(?:#|N┬░|NO|:)?\\s*([IVXLCDM]+)\\b', 'i');
                const mRoman = s.match(regexRoman);
                if (mRoman && romanMap[mRoman[1].toUpperCase()]) {
                    return romanMap[mRoman[1].toUpperCase()];
                }

                // 3. Ordinal en fran├ºais li├® au mot-cl├® (ex: PREMIER MOMENT, 2EME PHASE, MOMENT PREMIER)
                if (new RegExp('(?:\\b(?:1ER|PREMIER|PREMIERE|PREMI├êRE)\\s+' + kw + '\\b)|(?:\\b' + kw + '\\s+(?:1ER|PREMIER|PREMIERE|PREMI├êRE)\\b)', 'i').test(s)) return 1;
                if (new RegExp('(?:\\b(?:2E|2EME|2├êME|SECOND|SECONDE|DEUXIEME|DEUXI├êME)\\s+' + kw + '\\b)|(?:\\b' + kw + '\\s+(?:2E|2EME|2├êME|SECOND|SECONDE|DEUXIEME|DEUXI├êME)\\b)', 'i').test(s)) return 2;
                if (new RegExp('(?:\\b(?:3E|3EME|3├êME|TROISIEME|TROISI├êME)\\s+' + kw + '\\b)|(?:\\b' + kw + '\\s+(?:3E|3EME|3├êME|TROISIEME|TROISI├êME)\\b)', 'i').test(s)) return 3;
                if (new RegExp('(?:\\b(?:4E|4EME|4├êME|QUATRIEME|QUATRI├êME)\\s+' + kw + '\\b)|(?:\\b' + kw + '\\s+(?:4E|4EME|4├êME|QUATRIEME|QUATRI├êME)\\b)', 'i').test(s)) return 4;
                if (new RegExp('(?:\\b(?:5E|5EME|5├êME|CINQUIEME|CINQUI├êME)\\s+' + kw + '\\b)|(?:\\b' + kw + '\\s+(?:5E|5EME|5├êME|CINQUIEME|CINQUI├êME)\\b)', 'i').test(s)) return 5;
                if (new RegExp('(?:\\b(?:6E|6EME|6├êME|SIXIEME|SIXI├êME)\\s+' + kw + '\\b)|(?:\\b' + kw + '\\s+(?:6E|6EME|6├êME|SIXIEME|SIXI├êME)\\b)', 'i').test(s)) return 6;

                // Si un mot-cl├® pr├®cis ├®tait demand├® mais qu'aucun num├®ro n'y est associ├®, on ne prend pas un chiffre arbitraire du reste de la phrase (ex: ligne 13)
                return null;
            }

            // Recherche g├®n├®rale (quand aucun mot-cl├® pr├®cis n'est impos├®)
            const generalDigit = s.match(/\b\d+\b/);
            if (generalDigit) return parseInt(generalDigit[0], 10);

            const generalRoman = s.match(/\b(VIII|VII|VI|IV|V|III|II|I|IX|X)\b/i);
            if (generalRoman && romanMap[generalRoman[1].toUpperCase()]) {
                return romanMap[generalRoman[1].toUpperCase()];
            }

            if (/\b(?:1ER|PREMIER|PREMIERE|PREMI├êRE)\b/i.test(s)) return 1;
            if (/\b(?:2E|2EME|2├êME|SECOND|SECONDE|DEUXIEME|DEUXI├êME)\b/i.test(s)) return 2;
            if (/\b(?:3E|3EME|3├êME|TROISIEME|TROISI├êME)\b/i.test(s)) return 3;
            if (/\b(?:4E|4EME|4├êME|QUATRIEME|QUATRI├êME)\b/i.test(s)) return 4;

            return null;
        }

        // G├®n├®ration d'abr├®viations courtes et intelligentes pour les pastilles de sections
        function getShortSectionCode(sectionName, index, allSections) {
            if (!sectionName || typeof sectionName !== 'string') return '';
            const s = sectionName.toUpperCase().trim();

            // 1. Phases (dans l'introduction ou tout d├®coupage de devoir par phases)
            if (s.includes('PHASE') || (typeof state !== 'undefined' && state.exerciseMode === 'intro')) {
                if (s.includes('PHASE')) {
                    const num = extractSectionNumber(s, 'PHASE');
                    if (num !== null) return 'P' + num;
                    if (Array.isArray(allSections)) {
                        const phaseSections = allSections.filter(sec => (sec.name || '').toUpperCase().includes('PHASE'));
                        const pos = phaseSections.findIndex(sec => sec.name === sectionName || (typeof index === 'number' && sec === allSections[index]));
                        if (pos >= 0) return 'P' + (pos + 1);
                    }
                    if (typeof index === 'number') return 'P' + (index + 1);
                    return 'P1';
                }

                // En mode introduction sans le mot 'PHASE' explicite dans le titre
                if (typeof state !== 'undefined' && state.exerciseMode === 'intro') {
                    if (s.includes('AMORCE') || s.includes('ACCROCHE')) return 'P1';
                    if (s.includes('NOTION') || s.includes('CONCEPT') || s.includes('D├ëFINITION') || s.includes('DEFINITION') || s.includes('TERME')) return 'P2';
                    if (s.includes('PROBL├ëM') || s.includes('PROBLEM') || s.includes('APORIE')) return 'P3';
                    if (s.includes('ANNONCE') || s.includes('PLAN') || s.includes('D├ëMARCHE') || s.includes('DEMARCHE')) return 'P4';
                    if (typeof index === 'number') return 'P' + (index + 1);
                    return 'P1';
                }
            }

            // 2. Sous-Moment
            if (s.includes('SOUS-MOMENT') || s.includes('SOUS MOMENT') || s.startsWith('SM')) {
                const num = extractSectionNumber(s, 'SOUS-MOMENT') || extractSectionNumber(s, 'SOUS MOMENT') || extractSectionNumber(s, 'SM');
                if (num !== null) return 'SM' + num;
                if (Array.isArray(allSections)) {
                    const smSections = allSections.filter(sec => {
                        const str = (sec.name || '').toUpperCase();
                        return str.includes('SOUS-MOMENT') || str.includes('SOUS MOMENT') || str.startsWith('SM');
                    });
                    const pos = smSections.findIndex(sec => sec.name === sectionName || (typeof index === 'number' && sec === allSections[index]));
                    if (pos >= 0) return 'SM' + (pos + 1);
                }
                if (typeof index === 'number') return 'SM' + (index + 1);
                return 'SM';
            }

            // 3. Moment (explication de texte : M1, M2, M3...)
            if (s.includes('MOMENT') || /^M\s*\d+/i.test(s)) {
                const num = extractSectionNumber(s, 'MOMENT');
                if (num !== null) return 'M' + num;
                if (Array.isArray(allSections)) {
                    const mSections = allSections.filter(sec => {
                        const str = (sec.name || '').toUpperCase();
                        return str.includes('MOMENT') && !str.includes('SOUS-MOMENT') && !str.includes('SOUS MOMENT') && !str.startsWith('SM');
                    });
                    const pos = mSections.findIndex(sec => sec.name === sectionName || (typeof index === 'number' && sec === allSections[index]));
                    if (pos >= 0) return 'M' + (pos + 1);
                }
                if (typeof index === 'number') return 'M' + (index + 1);
                return 'M1';
            }

            // 4. Arguments
            if (s.startsWith('ARGUMENT') || s.startsWith('ARG')) {
                const num = extractSectionNumber(s, 'ARGUMENT') || extractSectionNumber(s, 'ARG') || extractSectionNumber(s);
                return num ? 'A' + num : 'Arg';
            }

            // 5. R├®f├®rences et exemples
            if (s.startsWith('R├ëF') || s.startsWith('REF') || s.startsWith('EXEMPLE')) {
                const num = extractSectionNumber(s, 'REF') || extractSectionNumber(s, 'EXEMPLE') || extractSectionNumber(s);
                return num ? 'R' + num : 'R';
            }

            // 6. Parties et axes
            if (s.startsWith('PARTIE') || s.startsWith('AXE')) {
                const num = extractSectionNumber(s, 'PARTIE') || extractSectionNumber(s, 'AXE') || extractSectionNumber(s);
                return num ? 'P' + num : 'Part';
            }

            // 7. ├ël├®ments conceptuels isol├®s
            if (s === 'TH├êSE' || s === 'THESE') return 'T';
            if (s === 'TH├êME' || s === 'THEME') return 'Th';
            if (s.includes('AMORCE')) return 'A';
            if (s === 'SUJET') return 'S';
            if (s.startsWith('├ëVIDENCE') || s.startsWith('EVIDENCE')) return 'EDC';
            if (s.startsWith('CONTRADICTION')) return 'CL';
            if (s.startsWith('PROBL├ëMATIQUE') || s.startsWith('PROBLEMATIQUE') || s === 'PROBL├êME' || s === 'PROBLEME') return 'Pb';
            if (s.startsWith('ANNONCE') || s.includes('PLAN')) return 'AP';
            if (s.startsWith('LIGNE')) return 'LD';
            if (s.startsWith('ENJEU')) return 'Enj';
            if (s.startsWith('CONCLUSION')) return 'C';
            if (s.startsWith('OBJECTION')) return 'Obj';
            if (s.startsWith('TRANSITION')) return 'Tr';
            if (s.startsWith('REFORMULATION')) return 'Rf';

            if (s.length <= 3) return s;

            return s.charAt(0);
        }

        function scrollToElement(id) {
            if (!id) return false;
            let el = document.getElementById(id);
            // Fallbacks robustes si l'identifiant n'est pas trouv├® directement
            if (!el && id === 'sec-regles-implicites') {
                el = document.querySelector('.regles-implicites-box') || Array.from(document.querySelectorAll('h2')).find(h => /R[├¿e]gles\s+implicites/i.test(h.textContent));
            }
            if (!el && id === 'sec-analyse-personnalisee') {
                el = document.querySelector('.global-eval-dashboard') || Array.from(document.querySelectorAll('h2')).find(h => /Analyse\s+personnalis/i.test(h.textContent));
            }
            if (!el && id === 'indice-general-conformite') {
                el = document.querySelector('.global-eval-dashboard');
            }
            if (el) {
                const yOffset = -20;
                const elementPosition = el.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset + yOffset;
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
                return true;
            }
            return false;
        }

        // Mise ├á jour incr├®mentale fluide de la barre de navigation rapide flottante (sans destruction du DOM pour pr├®server le survol et les clics)
        function updateFloatingQuickNav(sectionsList, globalScore) {
            let nav = document.getElementById('floating-quicknav');
            if (!nav) {
                nav = document.createElement('div');
                nav.id = 'floating-quicknav';
                nav.className = 'floating-quicknav';
                document.body.appendChild(nav);

            const isExplication = state.exerciseType === 'explication';

            const validSections = Array.isArray(sectionsList) ? sectionsList.filter(s => s && typeof s.score === 'number') : [];

            // Calculer ou r├®cup├®rer le score global de conformit├®
            let finalGlobalScore = (typeof globalScore === 'number') ? globalScore : null;
            if (finalGlobalScore === null && validSections.length > 0) {
                finalGlobalScore = Math.round(validSections.reduce((acc, s) => acc + s.score, 0) / validSections.length);

            // Empreinte d'├®tat pour ├®viter toute manipulation inutile du DOM pendant le streaming

                validSections.map(s => `${s.anchorId}:${s.score}:${s.name}`).join(';');

        function syncSelections(oldMode, newMode) {
            if (state.exerciseType === 'dissertation') {
                if ((oldMode === 'intro' || oldMode === 'dev') && newMode === 'argumentation') {
                    // Standard -> Argumentation
                    state.isCustomArgumentation = state.isCustomDissertation;

                    const inputCustomSujet = document.getElementById("input-custom-sujet");
                    const inputCustomThesis = document.getElementById("input-custom-thesis");
                    if (inputCustomSujet && inputCustomThesis) {
                        inputCustomThesis.value = inputCustomSujet.value;

                    if (!state.isCustomDissertation) {
                        const selectNotion = document.getElementById("select-notion");
                        const selectSujet = document.getElementById("select-sujet");
                        const selectNotionArg = document.getElementById("select-notion-arg");
                        const selectSujetArg = document.getElementById("select-sujet-arg");

                        if (selectNotion && selectNotionArg) {
                            const notion = selectNotion.value;
                            selectNotionArg.value = notion;
                            updateSujetsArg();

                            if (selectSujet && selectSujetArg && notion) {
                                const question = selectSujet.value;
                                if (sujetsPhilo[notion]) {
                                    const idx = sujetsPhilo[notion].findIndex(s => s.question === question);
                                    if (idx !== -1) {
                                        selectSujetArg.value = idx;
                                        updateArgThesisButtons();
                                    }
                                }
                            }
                        }
                    } else {
                        updateCustomArgPosition();
                    }
                } else if (oldMode === 'argumentation' && (newMode === 'intro' || newMode === 'dev')) {
                    // Argumentation -> Standard
                    state.isCustomDissertation = state.isCustomArgumentation;

                    const pre = document.getElementById('dissertation-predefined');
                    const cust = document.getElementById('dissertation-custom');
                    if (pre && cust) {
                        pre.style.display = state.isCustomDissertation ? 'none' : 'block';
                        cust.style.display = state.isCustomDissertation ? 'block' : 'none';
                    }

                    const inputCustomSujet = document.getElementById("input-custom-sujet");
                    const inputCustomThesis = document.getElementById("input-custom-thesis");
                    if (inputCustomSujet && inputCustomThesis) {
                        inputCustomSujet.value = inputCustomThesis.value;
                    }

                    if (!state.isCustomArgumentation) {
                        const selectNotion = document.getElementById("select-notion");
                        const selectSujet = document.getElementById("select-sujet");
                        const selectNotionArg = document.getElementById("select-notion-arg");
                        const selectSujetArg = document.getElementById("select-sujet-arg");

                        if (selectNotion && selectNotionArg) {
                            const notion = selectNotionArg.value;
                            selectNotion.value = notion;
                            updateSujets();

                            if (selectSujet && selectSujetArg && notion) {
                                const idx = parseInt(selectSujetArg.value, 10);
                                if (!isNaN(idx) && sujetsPhilo[notion] && sujetsPhilo[notion][idx]) {
                                    selectSujet.value = sujetsPhilo[notion][idx].question;
                                }
                            }
                        }
                    }
                }
            } else if (state.exerciseType === 'explication') {
                if ((oldMode === 'intro' || oldMode === 'dev') && newMode === 'argumentation') {
                    // Standard -> Argumentation
                    state.isCustomExplicationArg = state.isCustomExplication;

                    const inputCustomRef = document.getElementById("input-custom-ref");
                    const textareaCustomText = document.getElementById("textarea-custom-text");

                    const inputCustomArgRef = document.getElementById("input-custom-arg-ref");
                    const textareaCustomArgFragment = document.getElementById("textarea-custom-arg-fragment");

                    if (inputCustomRef && inputCustomArgRef) {
                        inputCustomArgRef.value = inputCustomRef.value;
                    }
                    if (textareaCustomText && textareaCustomArgFragment) {
                        textareaCustomArgFragment.value = textareaCustomText.value;
                    }

                    const preArg = document.getElementById('explication-arg-predefined');
                    const custArg = document.getElementById('explication-arg-custom');
                    if (preArg && custArg) {
                        preArg.style.display = state.isCustomExplicationArg ? 'none' : 'block';
                        custArg.style.display = state.isCustomExplicationArg ? 'block' : 'none';
                    }

                    if (!state.isCustomExplicationArg) {
                        if (state.currentExplicTextIndex !== null) {
                            const idx = state.currentExplicTextIndex;
                            if (!state.activeFragment || state.activeFragment.textIndex !== idx) {
                                state.activeFragment = { textIndex: idx, momentIndex: 0, subMomentIndex: 0 };
                            }
                            const textData = state.explicTexts[idx];
                            if (textData && textData.structure && textData.structure[state.activeFragment.momentIndex]) {
                                state.activeThesis = textData.structure[state.activeFragment.momentIndex].subMoments[state.activeFragment.subMomentIndex];
                                state.thesisOrientation = 'fragment';
                            } else {
                                state.activeThesis = null;
                                state.thesisOrientation = null;
                            }
                        }
                    } else {
                        updateCustomExplicationArg();
                    }
                } else if (oldMode === 'argumentation' && (newMode === 'intro' || newMode === 'dev')) {
                    // Argumentation -> Standard
                    state.isCustomExplication = state.isCustomExplicationArg;

                    const preExp = document.getElementById('explication-predefined');
                    const custExp = document.getElementById('explication-custom');
                    if (preExp && custExp) {
                        preExp.style.display = state.isCustomExplication ? 'none' : 'block';
                        custExp.style.display = state.isCustomExplication ? 'block' : 'none';
                    }

                    const inputCustomRef = document.getElementById("input-custom-ref");
                    const textareaCustomText = document.getElementById("textarea-custom-text");

                    const inputCustomArgRef = document.getElementById("input-custom-arg-ref");
                    const textareaCustomArgFragment = document.getElementById("textarea-custom-arg-fragment");

                    if (inputCustomRef && inputCustomArgRef) {
                        inputCustomRef.value = inputCustomArgRef.value;
                    }
                    if (textareaCustomText && textareaCustomArgFragment) {
                        textareaCustomText.value = textareaCustomArgFragment.value;
                    }

                    if (!state.isCustomExplicationArg) {
                        if (state.activeFragment && state.activeFragment.textIndex !== null) {
                            const idx = state.activeFragment.textIndex;
                            state.currentExplicTextIndex = idx;
                            state.currentExplicText = state.explicTexts[idx];
                        }
                    } else {
                        updateCustomExplication();
                    }
                }
            }
        }

        function populateSujetsConcours() {
            const selectSujet = document.getElementById("select-sujet");
            if (!selectSujet) return;
            const prevVal = selectSujet.value;
            selectSujet.innerHTML = '';

            const defaultOpt = document.createElement("option");
            defaultOpt.value = "";
            defaultOpt.textContent = `-- S├®lectionnez une annale officielle (${state.concours}) --`;
            selectSujet.appendChild(defaultOpt);

            const cData = getActiveAnnalesData();
            let targetVal = '';
            let bestEvaluatedVal = '';
            let bestEvaluatedTs = -1;

            const prof = getActiveProfile();
            const ctxKey = getContextKey(state.concours, state.epreuve);
            const savedCtx = (prof && prof.lastActiveByContext) ? prof.lastActiveByContext[ctxKey] : null;

            if (cData && Array.isArray(cData.dissertation) && cData.dissertation.length > 0) {
                cData.dissertation.forEach(item => {
                    const opt = document.createElement("option");
                    opt.value = item.title;

                    // Badge dynamique des corrections / brouillons enregistr├®s
                    let badgeText = '';
                    const stored = getSubjectStoredDraftAndCorrection('dissertation', 'redaction', item.title);
                    if (stored && Array.isArray(stored.crans) && stored.crans.length > 0) {
                        const count = stored.crans.length;
                        const latestCran = stored.crans[stored.crans.length - 1];
                        const score = (latestCran && typeof latestCran.score === 'number') ? `${latestCran.score}/100` : '';
                        badgeText = ` ­ƒƒó (${count} ├®valuation${count > 1 ? 's' : ''}${score ? ' ÔÇö ' + score : ''})`;
                        const cranTs = (latestCran && latestCran.timestamp) ? latestCran.timestamp : 0;
                        if (cranTs >= bestEvaluatedTs) {
                            bestEvaluatedTs = cranTs;
                            bestEvaluatedVal = item.title;
                        }

        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            if (!window.pdfjsLib) {
                throw new Error("Biblioth├¿que PDF.js indisponible.");
            }
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += (i > 1 ? "\n\n" : "") + pageText;
            }
            return { text: fullText, numPages: pdf.numPages };
        }

        async function handleCopyFileSelected(file) {
            if (!file) return;
            const statusAlert = document.getElementById('upload-status-alert');
            const textarea = document.getElementById('upload-modal-content');
            if (!textarea || !statusAlert) return;

            statusAlert.style.display = 'block';
            statusAlert.style.backgroundColor = '#eff6ff';
            statusAlert.style.color = '#1d4ed8';
            statusAlert.style.border = '1px solid #bfdbfe';
            statusAlert.textContent = `ÔÅ│ Extraction du texte de ┬½ ${file.name} ┬╗ en cours...`;

            try {
                let extractedText = "";
                const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';

                if (isPdf) {
                    const result = await extractTextFromPDF(file);
                    extractedText = result.text;
                    statusAlert.style.backgroundColor = '#f0fdf4';
                    statusAlert.style.color = '#166534';
                    statusAlert.style.border = '1px solid #bbf7d0';
                    statusAlert.textContent = `Ô£ô PDF extrait avec succ├¿s : ${result.numPages} page(s), ${extractedText.length.toLocaleString('fr-FR')} caract├¿res.`;
                } else {
                    extractedText = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = err => reject(err);
                        reader.readAsText(file);
                    });
                    statusAlert.style.backgroundColor = '#f0fdf4';
                    statusAlert.style.color = '#166534';
                    statusAlert.style.border = '1px solid #bbf7d0';
                    statusAlert.textContent = `Ô£ô Fichier texte charg├® : ${extractedText.length.toLocaleString('fr-FR')} caract├¿res.`;
                }

                textarea.value = extractedText;
                updateUploadCharCount(extractedText);
            } catch (err) {
                console.error("Erreur lors de l'extraction :", err);
                statusAlert.style.backgroundColor = '#fef2f2';
                statusAlert.style.color = '#991b1b';
                statusAlert.style.border = '1px solid #fecaca';
                statusAlert.textContent = `ÔØî Impossible d'extraire le texte : ${err.message}. Vous pouvez copier-coller manuellement votre texte dans la zone ci-dessous.`;
            }
        }

        function preserveAndCount(textarea) {
            if (textarea && typeof textarea.value === 'string') {
                if (textarea.value.length === 0) {
                    textarea.value = "    ";
                    textarea.selectionStart = textarea.selectionEnd = 4;
                } else if (!textarea.value.startsWith("    ")) {
                    const oldStart = textarea.selectionStart;
                    const oldEnd = textarea.selectionEnd;
                    const stripped = textarea.value.replace(/^\s*/, '');
                    textarea.value = "    " + stripped;
                    textarea.selectionStart = Math.max(4, oldStart + 4);
                    textarea.selectionEnd = Math.max(4, oldEnd + 4);
                }
            }
            saveCurrentDraftToLastRenderedSubject();
            updateCharCount(textarea);
        }

        function handleTextareaFocus(textarea) {
            if (!textarea) return;
            if (!textarea.value || textarea.value.trim() === '') {
                textarea.value = "    ";
                textarea.selectionStart = textarea.selectionEnd = 4;
                saveCurrentDraftToLastRenderedSubject();
                updateCharCount(textarea);
            } else if (textarea.selectionStart < 4 && !textarea.value.substring(0, textarea.selectionStart).includes('\n')) {
                textarea.selectionStart = textarea.selectionEnd = 4;
            }
        }

        function handleTextareaPaste(e, textarea) {
            if (!e.clipboardData) return;
            const pasteData = e.clipboardData.getData('text');
            if (!pasteData) return;

            e.preventDefault();
            // Assure automatiquement un alin├®a (4 espaces) pour chaque paragraphe non vide coll├®
            const lines = pasteData.split(/\r?\n/);
            const formattedLines = lines.map(line => {
                if (line.trim().length === 0) return '';
                if (line.startsWith('    ') || line.startsWith('\t')) {
                    return '    ' + line.replace(/^(\t|\s{4})/, '').trimStart();
                }
                return '    ' + line.trimStart();
            });
            const formattedText = formattedLines.join('\n');

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.setRangeText(formattedText, start, end, 'end');
            preserveAndCount(textarea);
        }

        function handleTextareaKeydown(e, textarea) {
            const INDENT = "    "; // 4 espaces d'alin├®a typographique

            if (e.key === 'Tab') {
                e.preventDefault();
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (e.shiftKey) {
                    const val = textarea.value;
                    const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                    if (val.substring(lineStart, lineStart + 4) === INDENT) {
                        textarea.setRangeText('', lineStart, lineStart + 4, 'end');
                        preserveAndCount(textarea);
                    }
                } else {
                    textarea.setRangeText(INDENT, start, end, 'end');
                    preserveAndCount(textarea);
                }
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const val = textarea.value;
                const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                const currentLine = val.substring(lineStart, start);

                // Si l'utilisateur appuie sur Entr├®e sur une ligne qui ne contient que l'alin├®a (pour sauter un paragraphe)
                if (currentLine === INDENT && start === end) {
                    textarea.setRangeText('\n' + INDENT, lineStart, end, 'end');
                    preserveAndCount(textarea);
                    return;
                }

                const insert = '\n' + INDENT;
                let handled = false;
                try {
                    if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
                        handled = document.execCommand('insertText', false, insert);
                    }
                } catch (err) {
                    handled = false;
                }

                if (!handled) {
                    textarea.setRangeText(insert, start, end, 'end');
                }

                preserveAndCount(textarea);
                return;
            }

            // Si une s├®lection incluant le tout d├®but du texte est effac├®e (ex: Ctrl+A + Backspace/Delete),
            // on conserve toujours le premier alin├®a de 4 espaces quoi qu'il arrive
            if ((e.key === 'Backspace' || e.key === 'Delete') && textarea.selectionStart === 0 && textarea.selectionEnd > 0) {
                e.preventDefault();
                textarea.setRangeText(INDENT, 0, textarea.selectionEnd, 'end');
                preserveAndCount(textarea);
                return;
            }

            if (e.key === 'Backspace') {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                if (start !== end) {
                    return;
                }

                const val = textarea.value;
                const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                const lineEnd = val.indexOf('\n', start);
                const actualLineEnd = lineEnd === -1 ? val.length : lineEnd;
                const currentLine = val.substring(lineStart, actualLineEnd);
                const leadingMatch = currentLine.match(/^\s+/);
                const leadingSpacesCount = leadingMatch ? leadingMatch[0].length : 0;

                // Si le curseur se trouve dans la zone d'alin├®a en d├®but de ligne
                if (start <= lineStart + leadingSpacesCount) {
                    e.preventDefault();
                    if (lineStart > 0) {
                        // Lignes 2 et suivantes : supprime le saut de ligne pr├®c├®dent et l'alin├®a pour revenir ├á la ligne du dessus
                        textarea.setRangeText('', lineStart - 1, lineStart + leadingSpacesCount, 'end');
                        preserveAndCount(textarea);
                    } else {
                        // Premi├¿re ligne : l'alin├®a initial reste quoi qu'il arrive
                        textarea.selectionStart = textarea.selectionEnd = leadingSpacesCount;
                    }
                    return;
                }
            }

            if (e.key === 'Delete') {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                // Emp├¬che la touche Suppr d'effacer les espaces du premier alin├®a si le curseur est plac├® avant
                if (start === end && start < 4 && !textarea.value.substring(0, start).includes('\n')) {
                    const lineEnd = textarea.value.indexOf('\n');
                    const firstLine = lineEnd === -1 ? textarea.value : textarea.value.substring(0, lineEnd);
                    const lead = firstLine.match(/^\s+/);
                    if (lead && start < lead[0].length) {
                        e.preventDefault();
                        textarea.selectionStart = textarea.selectionEnd = lead[0].length;
                        return;
                    }
                }

                if (start === end && start < textarea.value.length && textarea.value[start] === '\n') {
                    const nextLine = textarea.value.substring(start + 1);
                    const leadingMatch = nextLine.match(/^\s+/);
                    if (leadingMatch && leadingMatch[0].length > 0) {
                        e.preventDefault();
                        textarea.setRangeText('', start, start + 1 + leadingMatch[0].length, 'end');
                        preserveAndCount(textarea);
                        return;
                    }
                }
            }
        }

            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');

                    state.currentExplicText.structure.forEach((moment, mIdx) => {
